    }

    if (isAheadInLane && distance < CAR_LENGTH * 4) {
      const dot = Math.cos(car.heading) * (otherCar.x - car.x) + Math.sin(car.heading) * (otherCar.y - car.y);
      if (dot > 0) {
        mustYield = true;
        reason    = 'following';
        hasFollowingConflict = true;
        const bumperGap = Math.max(0, dot - CAR_LENGTH);
        if (bumperGap < leadGapPx) {
          leadGapPx = bumperGap;
          leadSpeedFactor = otherCar.currentSpeedFactor;
        }
      }
    }

    /* Rule 2 – intersection conflicts
       Also evaluate while mid ellipse→vertical turn even after commitment: committing
       only means "past the stop line", not "ignore cross traffic finishing their turn". */
    const otherLongitudinal =
      Math.cos(car.heading) * (otherCar.x - car.x) + Math.sin(car.heading) * (otherCar.y - car.y);
    const otherIsBehind = otherLongitudinal < -CAR_LENGTH * 0.2;
    const carEllipseToVertical = isEllipseToVerticalManeuver(car);
    if (!otherIsBehind &&
        (!car.isCommittedToTurn || car.turnState === 'rejoining' || carEllipseToVertical)) {
      const overlap = checkTrajectoryIntersection(car, otherCar);
      if (overlap) {
        
        /* ----------------------------------------------------------
           Re-joining → ellipse (vertical → ellipse)
           ---------------------------------------------------------- */
        if (car.turnState === 'rejoining' && car.verticalDirection !== null) {
          // Yield to main-road ellipse traffic when trajectories overlap.
          // Skip complementary diverging exits (vertical-right vs ellipse-left, etc.).
          if (otherCar.path === 'ellipse' && otherCar.turnState !== 'rejoining') {
             if (!shouldSkipYieldForDivergingManeuver(car, otherCar)) {
               mustYield = true;
               reason = 'rejoin-yield-to-main-road';
               yieldRule_rejoin = true;
               yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
               if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) logEvent('behavior', `${carName} rejoin yielding to Car${allCars.indexOf(otherCar)+1}`);
             } else if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
               logEvent('behavior', `${carName} skip rejoin yield to Car${allCars.indexOf(otherCar)+1} (diverging ellipse exit)`);
             }
          }
        }
        /* 2.1.1  vertical → ellipse right */
        if (car.path === 'vertical' &&
            car.turnDirection === 'right' &&
            car.turnState !== 'turning' &&
            !car.isCommittedToTurn) {

          // Rule 2.1.1: yield to CW ellipse traffic. Do not wait for an ellipse car that is
          // turning left onto the vertical (complementary, non-conflicting with a right exit).
          // Also treat mid ellipse→vertical cars (path already flipped) as elliptical traffic —
          // they still occupy the crossroad the side road must not enter.
          const otherIsEllipseTraffic =
            otherCar.path === 'ellipse' ||
            (otherCar.path === 'vertical' && otherCar.turnState === 'turning') ||
            isEllipseToVerticalManeuver(otherCar);
          if (otherIsEllipseTraffic && otherCar.direction === 1) {
            if (!shouldSkipYieldForDivergingManeuver(car, otherCar)) {
              mustYield = true;
              reason    = 'intersection-vertical-right';
              yieldRule_2_1_1 = true;
              yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
              if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} at vertical->ellipse right`);
            } else if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
              logEvent('behavior', `${carName} skip vertical-right yield to Car${allCars.indexOf(otherCar)+1} (diverging ellipse exit)`);
            }
          }
        }
        /* 2.1.2  vertical → ellipse left
           Side-road left exit yields to elliptical traffic in either direction (Rules.txt 2.1.2).
           Require path===vertical so main-road left turns do not accidentally enter this branch. */
        else if (car.path === 'vertical' &&
                 car.turnDirection === 'left' &&
                 car.turnState !== 'turning' &&
                 !car.isCommittedToTurn) {
          // Ellipse cars, mid ellipse→vertical entries, and same-junction exchange traffic.
          const otherIsEllipseOrExchange =
            otherCar.path === 'ellipse' ||
            (otherCar.path === 'vertical' && otherCar.turnState === 'turning') ||
            isEllipseToVerticalManeuver(otherCar);
          if (otherIsEllipseOrExchange) {
            // Yield to through / exchange traffic either way; skip only complementary exits.
            if (!shouldSkipYieldForDivergingManeuver(car, otherCar)) {
              mustYield = true;
              reason    = 'intersection-vertical-left';
              yieldRule_2_1_2 = true;
              yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
              if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} at vertical->ellipse left`);
            } else if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
              logEvent('behavior', `${carName} skip vertical-left yield to Car${allCars.indexOf(otherCar)+1} (diverging ellipse exit)`);
            }
          } else if (otherCar.path === 'vertical' || (otherCar.turnState === 'rejoining' && otherCar.verticalDirection !== null)) {
            const carIsectY = car.verticalDirection === 'up' ? centerY - car.b : centerY + car.b;
            const carDist   = Math.abs(car.y - carIsectY);
            const othDist   = Math.abs(otherCar.y - carIsectY);
            if (othDist < carDist) {
              mustYield = true;
              reason    = 'intersection-vertical-left';
              yieldRule_2_1_2 = true;
              yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
              if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} at vertical->ellipse left`);
            }
          }
        }

        /* Opposite-direction vertical conflict (head-on on the vertical road) */
        if (car.path === 'vertical' &&
            otherCar.path === 'vertical' &&
            car.verticalDirection &&
            otherCar.verticalDirection &&
            car.verticalDirection !== otherCar.verticalDirection) {

            const crossroadY = (car.verticalDirection === 'up')
                ? centerY - ELLIPSE_B0
                : centerY + ELLIPSE_B0;
            const myDist    = Math.abs(car.y - crossroadY);
            const othDist   = Math.abs(otherCar.y - crossroadY);
            const otherMidFromEllipse = otherCar.turnState === 'turning' && otherCar.isMakingTurn;
            const iAmMidFromEllipse = car.turnState === 'turning' && car.isMakingTurn;
            let verticalOppositeReason = null;
            if (otherMidFromEllipse && !iAmMidFromEllipse) {
                verticalOppositeReason = 'vertical-opposite-yield-to-committed';
            } else if (!iAmMidFromEllipse && othDist < myDist - 5) {
                verticalOppositeReason = 'vertical-turn-opposite';
            } else if (iAmMidFromEllipse && otherMidFromEllipse && othDist < myDist) {
                verticalOppositeReason = 'vertical-turn-opposite';
            }
            if (verticalOppositeReason && !shouldSkipYieldForDivergingManeuver(car, otherCar)) {
                mustYield = true;
                reason = verticalOppositeReason;
                if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
                  logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} ${reason}`);
                }
            }
        }

        /* 2.2.1 ellipse → vertical left yields to opposite on ellipse.
           Only fires BEFORE commitment — once committed and mid-turn on the
           vertical road the car must complete its turn; keeping it yielded
           blocks the junction and creates deadlocks (Car1-vs-Car6 crash).
           Skip peer uncommitted opposite exits to avoid mutual freezes. */
        const isEllipseToVerticalLeft = car.turnDirection === 'left' && carEllipseToVertical;

        if (isEllipseToVerticalLeft && !car.isCommittedToTurn) {
            if (isHigherPriorityEllipseCrossTraffic(car, otherCar)) {
                mustYield = true;
                reason = 'ellipse-left-yield-to-opposite';
                yieldRule_2_2_1 = true;
                yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
                if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} ellipse->vertical left vs opposite`);
            }
        }

        /* 2.2.2 ellipse → vertical right yields to cars navigating vertical crossroad
           (and left turns: yield to anyone still exchanging vertical↔ellipse with overlap). */
        const isEllipseToVerticalRight = car.turnDirection === 'right' && carEllipseToVertical;
        if (carEllipseToVertical && !car.isCommittedToTurn) {
          const otherAtThisJunction = isOtherAtCarsJunction(car, otherCar);
          const otherExchanging = isNavigatingVerticalEllipseExchange(otherCar);
          // Peer uncommitted ellipse→vertical is NOT "navigating the vertical crossroad" yet.
          const otherPeerUncommittedExit =
            isEllipseToVerticalManeuver(otherCar) && !otherCar.isCommittedToTurn;
          const hitEx = getStaticOccupancyHitDistance(car, otherCar);
          const exchangeNear = Number.isFinite(hitEx) && hitEx < CAR_LENGTH * 2.5;
          // Right turn (2.2.2): only yield to a car that is actually in THIS junction's
          // vertical crossroad. Distant vertical traffic (other end of the road) and an
          // empty junction must not impose the 2–3s yield timeout.
          const rightConflict = isEllipseToVerticalRight && otherAtThisJunction &&
            otherCar.path === 'vertical' &&
            !otherPeerUncommittedExit &&
            !shouldSkipYieldForDivergingManeuver(car, otherCar) &&
            (isPointInArea(otherCar.x, otherCar.y, crossroadAreaForJunction(junctionOfCar(car))) ||
              otherExchanging) &&
            (otherCar.currentSpeedFactor > 0.03 || exchangeNear ||
              (Number.isFinite(hitEx) && hitEx < CAR_LENGTH * 1.5));
          // Left / either: wait for active vertical↔ellipse exchange at this junction.
          const exchangeConflict = otherExchanging &&
            otherAtThisJunction &&
            !otherPeerUncommittedExit &&
            !shouldSkipYieldForDivergingManeuver(car, otherCar) &&
            (otherCar.currentSpeedFactor > 0.04 || exchangeNear);

          if (rightConflict || exchangeConflict) {
            mustYield = true;
            reason = isEllipseToVerticalRight
              ? 'ellipse-right-yield-to-vertical'
              : 'ellipse-to-vertical-yield-to-exchange';
            if (isEllipseToVerticalRight) {
              yieldRule_2_2_2 = true;
            } else {
              yieldRule_2_2_1 = true;
            }
            yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
            if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
              logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} ellipse->vertical vs crossroad/exchange (${reason})`);
            }
          }
        }

        /* Catch-all: ellipse→vertical vs SAME-DIRECTION free through traffic only.
           Previous broad catch-all yielded to every overlapping ellipse car, so a
           right-turn with ROW (Car6) froze for an opposite left-turn (Car1). */
        if (carEllipseToVertical && !car.isCommittedToTurn && !mustYield) {
          const otherIsRejoining = otherCar.turnState === 'rejoining' ||
            (otherCar.path === 'ellipse' && otherCar.verticalDirection !== null);
          const otherAheadDot = Math.cos(car.heading) * (otherCar.x - car.x) + Math.sin(car.heading) * (otherCar.y - car.y);
          const otherFreeSameDir =
            otherCar.path === 'ellipse' &&
            !otherIsRejoining &&
            otherCar.direction === car.direction &&
            !isEllipseToVerticalManeuver(otherCar) &&
            otherAheadDot > CAR_LENGTH * 0.2;
          if (otherFreeSameDir) {
            mustYield = true;
            reason = 'ellipse-to-vertical-same-dir-through';
            yieldRule_2_2_1 = true;
            yieldConflictMinDist = Math.min(yieldConflictMinDist, distance);
            if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
              logEvent('behavior', `${carName} yielding to Car${allCars.indexOf(otherCar)+1} ellipse->vertical vs same-dir through traffic`);
            }
          }
        }
      }
    }

    // Same vertical lane: only the rear car may priority-yield to the lead.
    // Without this, two mid ellipse→vertical cars (left+right) mutually yield and freeze,
    // then force-unstick tries to break it and can rear-end the lead (Car1→Car2 crash).
    if (mustYield && reason !== 'following' &&
        car.path === 'vertical' && otherCar.path === 'vertical' &&
        car.verticalDirection && car.verticalDirection === otherCar.verticalDirection) {
      const otherIsAhead =
        (car.verticalDirection === 'up' && otherCar.y < car.y - 4) ||
        (car.verticalDirection === 'down' && otherCar.y > car.y + 4);
      if (!otherIsAhead) {
        mustYield = false;
        reason = null;
      }
    }

    // ROW safety net: never priority-yield to an uncommitted ellipse→vertical peer when
    // we outrank them (free through or higher-priority main-road actor). Prevents Car6
    // with right-of-way from freezing while Car1 waits/turns at the opposite approach.
    if (mustYield && reason !== 'following' &&
        isEllipseToVerticalManeuver(otherCar) && !otherCar.isCommittedToTurn &&
        hasMainRoadPriorityOver(car, otherCar) &&
        !checkPolygonIntersection(getCarBoundingBox(car), getCarBoundingBox(otherCar))) {
      mustYield = false;
      reason = null;
    }

    // Don't wait forever for a partner that is itself fully stuck and not on our body.
    // (Following/queue still respects a stopped lead ahead — that is real traffic.)
    // NEVER drop a side-road / rejoin yield while future trajectories still claim the same
    // crossroad space — that is exactly the Car6-at-stop-line vs Car5 failure mode:
    // car5 may be nearly stopped for its own yield while its planned path still crosses ours.
    if (mustYield && reason !== 'following' && reason !== 'rejoin-yield-to-main-road' &&
        otherCar.currentSpeedFactor < 0.05) {
      const otherStuckMs = otherCar.stoppedSince ? (performance.now() - otherCar.stoppedSince) : 0;
      const hitToOther = getStaticOccupancyHitDistance(car, otherCar);
      const stillTrajectoryConflict = checkTrajectoryIntersection(car, otherCar);
      const isSideRoadPriorityYield =
        reason === 'intersection-vertical-left' ||
        reason === 'intersection-vertical-right' ||
        reason === 'rejoin-yield-to-main-road';
      if (otherStuckMs > GRIDLOCK_STUCK_MS * 0.6 &&
          (!Number.isFinite(hitToOther) || hitToOther > CAR_LENGTH * 1.05) &&
          !stillTrajectoryConflict &&
          !isSideRoadPriorityYield) {
        mustYield = false;
        reason = null;
      }
    }

    if (mustYield) {
      if (reason !== 'following') {
        hadPriorityConflict = true;
      }
      shouldStop = true;
      yieldTargets.push({
        other: getCarName(otherCar),
        reason,
        dist: roundDebug(distance),
        otherPath: otherCar.path,
        otherDir: otherCar.direction === 1 ? 'CW' : (otherCar.direction === -1 ? 'CCW' : otherCar.direction),
        otherVDir: otherCar.verticalDirection,
        otherTurnState: otherCar.turnState,
        otherTurnDir: otherCar.turnDirection,
        otherCommitted: !!otherCar.isCommittedToTurn,
        otherSpeed: roundDebug(otherCar.currentSpeedFactor, 3)
      });
      if (reason === 'following') {
        const gap = CAR_LENGTH * 0.4;
        const stopDist = CAR_LENGTH + gap;
        const reactDist = CAR_LENGTH * 4;
        if (distance < stopDist) {
          collisionSlowdown = 0;
        } else {
          const p = 1 - ((distance - stopDist) / (reactDist - stopDist));
          collisionSlowdown = Math.min(collisionSlowdown, Math.max(0, 1 - Math.max(0, p)));
        }
        // Kinematic cap: able to stop within bumper gap (Rule 1 / MAX_ACCELERATION).
        const bumperGap = Math.max(0.001, Math.max(0, Math.cos(car.heading) * (otherCar.x - car.x) + Math.sin(car.heading) * (otherCar.y - car.y) - CAR_LENGTH));
        const maxFollowVel = Math.sqrt(2 * MAX_ACCELERATION * bumperGap);
        const maxFollowFactor = maxFollowVel / Math.max(0.001, car.maximumSpeed * 50);
        collisionSlowdown = Math.min(collisionSlowdown, maxFollowFactor);
        const queueRisk = clamp((CAR_LENGTH * 2.6 - distance) / (CAR_LENGTH * 2.6), 0, 1);
        needsAggressive = Math.max(needsAggressive, queueRisk);
      } else {
        // Priority / merge yields: plan to be stopped with a full car-length buffer,
        // not only when already <60px (old p>0.8). Late soft braking caused rejoin crashes.
        const stopBuffer = CAR_LENGTH * (reason === 'rejoin-yield-to-main-road' ? 1.1 : 0.85);
        const stopDist = Math.max(0.001, distance - stopBuffer);
        const maxYieldVel = Math.sqrt(2 * MAX_ACCELERATION * stopDist);
        const maxYieldFactor = maxYieldVel / Math.max(0.001, car.maximumSpeed * 50);
        collisionSlowdown = Math.min(collisionSlowdown, maxYieldFactor);
        // Ramp aggressiveness with distance instead of snapping to full emergency.
        if (distance < stopBuffer + CAR_LENGTH * 0.25) {
          collisionSlowdown = 0;
          needsAggressive = Math.max(needsAggressive, 0.95);
        } else if (distance < CAR_LENGTH * 3.5) {
          const near = clamp(1 - (distance - stopBuffer) / (CAR_LENGTH * 3.0), 0, 1);
          needsAggressive = Math.max(needsAggressive, 0.35 + 0.5 * near);
        } else {
          needsAggressive = Math.max(needsAggressive, 0.35);
        }
      }
    }
  }

  // Smooth the speed cap in both directions: rises blend gently (comfort release),
  // moderate falls ease over a few frames so distance-cap jitter cannot pump the
  // throttle; only severe/imminent drops engage instantly for safety. Actual speed
  // remains rate-limited afterwards regardless.
  {
    const rawCs = collisionSlowdown;
    if (!Number.isFinite(car.smoothedCollisionSlowdown)) {
      car.smoothedCollisionSlowdown = rawCs;
    } else if (rawCs < car.smoothedCollisionSlowdown) {
      const imminentBody = Number.isFinite(leadGapPx) && leadGapPx < CAR_LENGTH * 0.5;
      if (imminentBody && (rawCs <= 0.001 || rawCs < car.smoothedCollisionSlowdown * 0.5)) {
        car.smoothedCollisionSlowdown = rawCs;
      } else {
        car.smoothedCollisionSlowdown += (rawCs - car.smoothedCollisionSlowdown) * dtRate(TARGET_COMMAND_SMOOTH_DOWN);
      }
    } else {
      car.smoothedCollisionSlowdown += (rawCs - car.smoothedCollisionSlowdown) * dtRate(TARGET_COMMAND_SMOOTH_UP);
    }
    collisionSlowdown = clamp(car.smoothedCollisionSlowdown, 0, 1);
  }

  const hasLeadVehicle = Number.isFinite(leadGapPx);
  const followRisk = hasLeadVehicle ? clamp((CAR_LENGTH * 2.4 - leadGapPx) / (CAR_LENGTH * 2.4), 0, 1) : 0;
  const closingRate = hasLeadVehicle ? Math.max(0, car.currentSpeedFactor - leadSpeedFactor) : 0;
  if (hasLeadVehicle && (followRisk > 0.25 || closingRate > 0.08)) {
    const safetySlowdown = clamp(1 - (followRisk * 0.85 + closingRate * 0.9), 0, 1);
    collisionSlowdown = Math.min(collisionSlowdown, safetySlowdown);
    // Only hard-stop when a rear-end is imminent; mid-range follow uses the
    // continuous speed cap so throttle does not chatter across the old 0.55/0.14 edges.
    if (leadGapPx < CAR_LENGTH * 0.5 && (followRisk > 0.85 || closingRate > 0.35)) {
      shouldStop = true;
    }
    needsAggressive = Math.max(needsAggressive, clamp(followRisk + closingRate, 0, 1));
  }

  /* ----------  Defensive occupancy (static only, priority-aware) ----------
     Prevents main-road cars from hitting a stopped merge already in the roadway,
     without freezing whole junctions on mutual predicted-path overlaps. */
  let defensiveHitDist = Infinity;
  let defensiveOtherId = null;
  let defensiveOther = null;
  for (const otherCar of allCars) {
    if (otherCar === car) continue;
    // Complementary arcs (e.g. vertical-right vs ellipse-left at same junction) must not
    // freeze each other with defensive hard-stops — only true body overlap matters.
    if (isComplementaryCrossroadPair(car, otherCar) &&
        !checkPolygonIntersection(getCarBoundingBox(car), getCarBoundingBox(otherCar))) {
      continue;
    }
    if (shouldSkipYieldForDivergingManeuver(car, otherCar)) continue;
    // Uncommitted ellipse→vertical right must not defensive-brake for a car at the
    // opposite junction (future path may graze the vertical lane far away).
    if (isEllipseToVerticalManeuver(car) && car.turnDirection === 'right' &&
        !car.isCommittedToTurn && !isOtherAtCarsJunction(car, otherCar)) {
      continue;
    }
    const hitDist = getStaticOccupancyHitDistance(car, otherCar);
    if (hitDist < defensiveHitDist) {
      defensiveHitDist = hitDist;
      defensiveOtherId = getCarName(otherCar);
      defensiveOther = otherCar;
    }
  }
  let defensiveBrake = false;
  if (Number.isFinite(defensiveHitDist) && defensiveHitDist < trajectoryDistance && defensiveOther) {
    defensiveBrake = true;
    const otherStopped = defensiveOther.currentSpeedFactor < 0.06;
    const iHavePriority = hasMainRoadPriorityOver(car, defensiveOther);
    const otherUncommittedExit =
      isEllipseToVerticalManeuver(defensiveOther) && !defensiveOther.isCommittedToTurn;
    // ROW car facing an uncommitted ellipse exit that must yield to us: only hard-brake
    // on near body contact. Otherwise we "wait for a bit" despite having right of way
    // (Car6 free/right-turn vs Car1 left-turn at bottom junction).
    const softPriorityVsYielder = iHavePriority && otherUncommittedExit;
    const buffer = CAR_LENGTH * 0.55;
    const stopDist = Math.max(0.001, defensiveHitDist - buffer);
    const maxDefVel = Math.sqrt(2 * MAX_ACCELERATION * stopDist);
    const maxDefFactor = maxDefVel / Math.max(0.001, car.maximumSpeed * 50);

    // NEVER allow a speed floor when close — Car6 creeps at 0.15 into stopped Car1 was a crash.
    // Priority only permits a gentle creep when the obstacle is still well ahead.
    if (defensiveHitDist <= CAR_LENGTH * 0.65) {
      // True near-miss / body-path conflict: always hard stop.
      collisionSlowdown = 0;
      needsAggressive = 1;
      shouldStop = true;
    } else if (softPriorityVsYielder) {
      // Keep moving with a kinematic cap; do not freeze for a yielder still on the ellipse.
      collisionSlowdown = Math.min(collisionSlowdown, Math.max(0.35, maxDefFactor));
      needsAggressive = Math.max(needsAggressive, 0.35);
    } else if (defensiveHitDist <= CAR_LENGTH * 1.25) {
      collisionSlowdown = 0;
      needsAggressive = 1;
      shouldStop = true;
    } else if (iHavePriority && otherStopped && defensiveHitDist > CAR_LENGTH * 2.0) {
      // Far-ahead stopped yielder: slow / creep, don't freeze the main road forever.
      collisionSlowdown = Math.min(collisionSlowdown, Math.max(0.22, maxDefFactor));
      needsAggressive = Math.max(needsAggressive, 0.45);
    } else {
      // Full kinematic cap for everyone else (priority or not).
      collisionSlowdown = Math.min(collisionSlowdown, maxDefFactor);
      if (defensiveHitDist <= CAR_LENGTH * 2.2) {
        needsAggressive = Math.max(needsAggressive, 0.85);
        if (defensiveHitDist <= CAR_LENGTH * 1.6) shouldStop = true;
      } else {
        needsAggressive = Math.max(needsAggressive, 0.45);
      }
    }
    if (DEBUG_LOG && LOG_CONFIG.verboseYieldEvents) {
      logEvent('behavior', `${carName} defensive vs ${defensiveOtherId} hitDist=${defensiveHitDist.toFixed(1)} prio=${iHavePriority} otherStopped=${otherStopped}`);
    }
  }

  /* ----------  Stopping-point / Commit logic  ---------- */
  const VERTICAL_ROAD_LEFT  = centerX - ROAD_WIDTH / 2;
  const VERTICAL_ROAD_RIGHT = centerX + ROAD_WIDTH / 2;
  const yieldLineTop = centerY - (360 - ROAD_WIDTH / 2);
  const yieldLineBottom = centerY + (360 - ROAD_WIDTH / 2);

  let isAtYieldLine = false;
  let signedDistToYieldLine = Infinity;

  if (!car.isCommittedToTurn) {
    if (car.path === 'ellipse' && car.isMakingTurn) {
      signedDistToYieldLine = car.x > centerX
        ? frontBumperX - VERTICAL_ROAD_RIGHT
        : VERTICAL_ROAD_LEFT - frontBumperX;
      isAtYieldLine = signedDistToYieldLine <= 0;
    }
    const isVerticalManeuver = car.isMakingTurn && car.verticalDirection !== null;
    if (isVerticalManeuver) {
      signedDistToYieldLine = (car.verticalDirection === 'up')
        ? (frontBumperY - yieldLineTop)
        : (yieldLineBottom - frontBumperY);
      isAtYieldLine = signedDistToYieldLine <= 0;
    }
  }

  // When a priority (Rule 2) yield is active before the stop line, cap speed by distance
  // to the stop line — not only by Euclidean distance to the conflicting car. Otherwise a
  // far-but-conflicting ellipse car lets the side-road car roll through the stop line.
  if (shouldStop && hadPriorityConflict && !car.isCommittedToTurn &&
      Number.isFinite(signedDistToYieldLine) && signedDistToYieldLine > 0) {
    const maxLineVel = Math.sqrt(2 * MAX_ACCELERATION * signedDistToYieldLine);
    const maxLineFactor = maxLineVel / Math.max(0.001, car.maximumSpeed * 50);
    collisionSlowdown = Math.min(collisionSlowdown, maxLineFactor);
    if (signedDistToYieldLine <= RULE6_STOP_LINE_TOLERANCE) {
      collisionSlowdown = 0;
      needsAggressive = 1;
    }
  }

  car.isYielding = shouldStop;
  if (car.isYielding) {
    if (!car.yieldStartTime) car.yieldStartTime = performance.now();
  } else {
    car.yieldStartTime = 0;
  }
  let yieldTimeoutFired = false;
  // Main-road (and committed ellipse) actors may force progress after a long standoff.
  // Side-road / rejoin traffic must keep yielding — forcing them through reintroduced crashes.
  const carIsRejoiningNow = car.turnState === 'rejoining' || (car.path === 'ellipse' && car.verticalDirection !== null);
  const isMainRoadActor = car.path === 'ellipse' && !carIsRejoiningNow;
  const yieldAgeMs = car.yieldStartTime ? (performance.now() - car.yieldStartTime) : 0;
  // Do not force-through while mid ellipse→vertical against active exchange traffic
  // (that is exactly the Car6-vs-Car5 failure mode).
  if (car.isYielding && yieldAgeMs > YIELD_TIMEOUT && !hasFollowingConflict &&
      (hadPriorityConflict || defensiveBrake) && isMainRoadActor &&
      !isEllipseToVerticalManeuver(car)) {
    car.isYielding = false;
    shouldStop     = false;
    car.yieldStartTime = 0;
    yieldTimeoutFired = true;
    // Critical: also release hard collision slowdown, otherwise timeout is a no-op.
    collisionSlowdown = Math.max(collisionSlowdown, 0.4);
    needsAggressive = Math.max(needsAggressive, 0.5);
  }

  /* commit once past the stopping line */
  let violatedYieldRule = false;
  if (!car.isCommittedToTurn) {
    let past = false;
    if (car.path === 'ellipse' && car.isMakingTurn) {
      past = car.x > centerX
        ? frontBumperX < VERTICAL_ROAD_RIGHT
        : frontBumperX > VERTICAL_ROAD_LEFT;
    }
    const isVerticalManeuver = car.isMakingTurn && car.verticalDirection !== null;
    if (isVerticalManeuver) {
      past = (car.verticalDirection === 'up'   && frontBumperY < yieldLineTop) ||
             (car.verticalDirection === 'down' && frontBumperY > yieldLineBottom);
    }
    if (past && !shouldStop && car.currentSpeedFactor > 0.01) {
      // Gap acceptance: block commit on real trajectory conflict with main-road cars.
      // Side-road (vertical→ellipse) must also respect nearly-stopped ellipse traffic whose
      // planned path still crosses the junction — ignoring speed<0.04 let Car6 commit past
      // the stop line while Car5 was slow/yielding with an overlapping trajectory.
      let entryBlocked = false;
      const needsGapCheck =
        car.isMakingTurn &&
        (car.path === 'vertical' || car.path === 'ellipse') &&
        (car.turnDirection === 'left' || car.turnDirection === 'right');
      const isSideRoadEntry = car.path === 'vertical' &&
        (car.turnDirection === 'left' || car.turnDirection === 'right') &&
        car.turnState !== 'turning';
      if (needsGapCheck) {
        for (const otherCar of allCars) {
          if (otherCar === car) continue;
          const otherIsRejoining = otherCar.turnState === 'rejoining' ||
            (otherCar.path === 'ellipse' && otherCar.verticalDirection !== null);
          // Main-road / exchange actors the side road must not cut off.
          const otherIsMainOrExchange =
            (otherCar.path === 'ellipse' && !otherIsRejoining) ||
            isEllipseToVerticalManeuver(otherCar) ||
            (otherCar.path === 'vertical' && otherCar.turnState === 'turning');
          if (!otherIsMainOrExchange) continue;
          // Ellipse→vertical entries may ignore a fully frozen distant yielder to avoid
          // permanent main-road freezes; side-road entries must always honor trajectory overlap.
          if (!isSideRoadEntry && otherCar.currentSpeedFactor < 0.04) continue;
          if (shouldSkipYieldForDivergingManeuver(car, otherCar)) continue;
          if (checkTrajectoryIntersection(car, otherCar)) {
            entryBlocked = true;
            break;
          }
        }
      }
      if (!entryBlocked) {
        car.isCommittedToTurn = true;
      } else {
        shouldStop = true;
        hadPriorityConflict = true;
        collisionSlowdown = 0;
        needsAggressive = 1;
      }
    }
    if (past && shouldStop && hadPriorityConflict) {
      violatedYieldRule = true;
    }
  }

  // Commitment means "past the stop line / free to enter" — not "ignore all traffic".
  // Rejoining and mid ellipse→vertical turns must still honor active crossroad conflicts
  // (e.g. Car6 left into vertical must wait for Car5 finishing a vertical→ellipse turn).
  const midEllipseToVertical = isEllipseToVerticalManeuver(car);
  if (car.isCommittedToTurn && car.turnState !== 'rejoining' && !midEllipseToVertical) {
    shouldStop   = false;
    car.isYielding = false;
    // Committed junction cars must not remain frozen solely by defensive caps against
    // stopped waiters (screenshot gridlock). Keep a hard stop only for true overlap.
    if (defensiveBrake && defensiveOther && defensiveHitDist > CAR_LENGTH * 1.25 &&
        hasMainRoadPriorityOver(car, defensiveOther) && defensiveOther.currentSpeedFactor < 0.06) {
      collisionSlowdown = Math.max(collisionSlowdown, 0.32);
    }
  }

  // Track continuous near-stop time (include slow creep freezes, not only exact zero).
  if (car.currentSpeedFactor < 0.06 &&
      (shouldStop || car.isYielding || collisionSlowdown < 0.2 || defensiveBrake || car.forceUnstickFrames > 0)) {
    if (!car.stoppedSince) car.stoppedSince = performance.now();
  } else if (car.currentSpeedFactor >= 0.1) {
    car.stoppedSince = 0;
  }
  const stoppedAgeMs = car.stoppedSince ? (performance.now() - car.stoppedSince) : 0;

  // Mid ellipse→vertical stuck in the junction: after a long yield, finish the turn.
  if (midEllipseToVertical && car.isCommittedToTurn && !hasFollowingConflict &&
      car.currentSpeedFactor < 0.02 && stoppedAgeMs > YIELD_TIMEOUT) {
    const trulyOverlapping = Number.isFinite(defensiveHitDist) && defensiveHitDist <= 0.5;
    if (!trulyOverlapping) {
      shouldStop = false;
      car.isYielding = false;
      collisionSlowdown = Math.max(collisionSlowdown, 0.22);
      if (collisionSlowdown < 0.2) collisionSlowdown = 0.22;
      if (Number.isFinite(defensiveHitDist) && defensiveHitDist < CAR_LENGTH) {
        collisionSlowdown = Math.min(collisionSlowdown, 0.18);
      }
    }
  }

  // Gridlock force (set by resolveGridlock): override yield/defensive freeze and creep.
  // Never force into a lead car (Rule 1) or a body that is already on our path.
  if (car.forceUnstickFrames > 0) {
    const bodyBlocked = Number.isFinite(defensiveHitDist) && defensiveHitDist <= CAR_LENGTH * 0.75;
    const leadBlocked = hasFollowingConflict && Number.isFinite(leadGapPx) && leadGapPx < CAR_LENGTH * 0.55;
    const protectedYield =
      (!car.isCommittedToTurn && hasPlannedVerticalExit(car)) ||
      (car.turnState === 'rejoining' && hadPriorityConflict);
    if (bodyBlocked || leadBlocked || protectedYield) {
      // Abort unstick: we are about to hit something real.
      car.forceUnstickFrames = 0;
      shouldStop = true;
      car.isYielding = true;
      collisionSlowdown = 0;
      needsAggressive = 1;
    } else {
      shouldStop = false;
      car.isYielding = false;
      let creep = 0.35;
      if (Number.isFinite(defensiveHitDist) && defensiveHitDist < CAR_LENGTH * 1.25) creep = 0.18;
      if (Number.isFinite(defensiveHitDist) && defensiveHitDist < CAR_LENGTH * 0.9) creep = 0.12;
      // Unstick creep, still capped by kinematic following distance when a lead exists.
      collisionSlowdown = creep;
      if (hasFollowingConflict && Number.isFinite(leadGapPx)) {
        const maxFollowVel = Math.sqrt(2 * MAX_ACCELERATION * Math.max(0.001, leadGapPx));
        const maxFollowFactor = maxFollowVel / Math.max(0.001, car.maximumSpeed * 50);
        collisionSlowdown = Math.min(collisionSlowdown, maxFollowFactor);
      }
    }
  }

  // Global stuck recovery for main-road / committed actors (single-car soft unstick).
  if (!hasFollowingConflict && car.currentSpeedFactor < 0.02 &&
      (isMainRoadActor || (car.isCommittedToTurn && car.turnState !== 'rejoining') || midEllipseToVertical) &&
      stoppedAgeMs > YIELD_TIMEOUT * 0.85) {
    if (!Number.isFinite(defensiveHitDist) || defensiveHitDist > CAR_LENGTH * 0.9) {
      shouldStop = false;
      car.isYielding = false;
      if (collisionSlowdown < 0.28) collisionSlowdown = 0.28;
    }
  }

  // Queue unstick: if we are following a lead that has also been stopped forever,
  // and gap is already safe, do not remain frozen as a dead queue (lead is gridlocked).
  if (hasFollowingConflict && hasLeadVehicle && car.currentSpeedFactor < 0.02 &&
      stoppedAgeMs > YIELD_TIMEOUT * 1.4 &&
      leadGapPx > RULE1_STOP_GAP_MIN &&
      leadSpeedFactor < 0.04) {
    if (!Number.isFinite(defensiveHitDist) || defensiveHitDist > CAR_LENGTH * 0.9) {
      // Only creep if lead is not immediately ahead body-to-body.
      shouldStop = false;
      collisionSlowdown = Math.max(collisionSlowdown, 0.12);
    }
  }

  const signedDistToYieldLineNorm = Number.isFinite(signedDistToYieldLine)
    ? signedDistToYieldLine / trajectoryDistance
    : 1.5;
  const isAtStopPoint = car.isYielding &&
                        hadPriorityConflict &&
                        !car.isCommittedToTurn &&
                        Number.isFinite(signedDistToYieldLine) &&
                        Math.abs(signedDistToYieldLine) <= RULE6_STOP_LINE_TOLERANCE;
  const onMainRoad = car.path === 'ellipse' && car.verticalDirection === null;
  const isEllipseToVerticalLeft = car.isMakingTurn && car.turnDirection === 'left' &&
                                  (car.path === 'ellipse' || (car.path === 'vertical' && car.turnState === 'turning'));
  const isEllipseToVerticalRight = car.isMakingTurn && car.turnDirection === 'right' &&
                                   (car.path === 'ellipse' || (car.path === 'vertical' && car.turnState === 'turning'));
  const isVerticalToEllipseRight = car.turnDirection === 'right' &&
                                   (car.path === 'vertical' || car.turnState === 'rejoining');
  const isVerticalToEllipseLeft = car.turnDirection === 'left' &&
                                  (car.path === 'vertical' || car.turnState === 'rejoining');
  const isSameLaneAhead = hasFollowingConflict;
  let overlapType = 'none';
  if (yieldRule_rejoin || yieldRule_2_2_2) {
    overlapType = 'merging';
  } else if (yieldRule_2_1_1) {
    overlapType = 'crossroad-clockwise';
  } else if (yieldRule_2_1_2 || yieldRule_2_2_1) {
    overlapType = 'crossroad-counterclockwise';
  } else if (hasFollowingConflict) {
    overlapType = 'same-lane';
  }
  const priorityStatus = onMainRoad ? 1 : -1;

  /* ----------  Speed & steering  ---------- */
  const maxSpeedPx = Math.max(0.001, car.maximumSpeed * 50);
  let targetFactor = 1;

  // Stable planned-stop latch: once a Rule-2 conflict requires stopping at this yield
  // line, keep riding the parabolic approach profile even when the overlap flickers
  // frame-to-frame — instead of surging between cruise and brake caps.
  if (car.turnState === 'approaching' && !car.isCommittedToTurn) {
    if ((shouldStop && hadPriorityConflict) || defensiveBrake) car.approachStopLatch = true;
  } else {
    car.approachStopLatch = false;
  }
  if (car.approachStopLatch) {
    let distToStop = Infinity;
    if (car.path === 'ellipse') {
      const yieldX = car.x > centerX ? VERTICAL_ROAD_RIGHT : VERTICAL_ROAD_LEFT;
      distToStop = Math.abs(frontBumperX - yieldX);
    } else if (car.path === 'vertical') {
      const yieldY = car.verticalDirection === 'up' ? yieldLineTop : yieldLineBottom;
      distToStop = Math.abs(frontBumperY - yieldY);
    }
    if (Number.isFinite(distToStop) && distToStop > 0) {
      const maxStopVel = Math.sqrt(2 * APPROACH_COMFORT_DECEL * distToStop);
      targetFactor = Math.min(targetFactor, maxStopVel / maxSpeedPx);
    }
  }

  targetFactor = Math.min(targetFactor, collisionSlowdown);

  // Rules.txt: Max Speed = sqrt(2 * MAX_ACCELERATION * TRAJECTORY_LENGTH * CarLength).
  // Cruise may never exceed the speed that is still stoppable within the trajectory,
  // otherwise every reaction gate keyed to trajectoryDistance runs out of braking room.
  const trajSpeedCeiling = Math.sqrt(2 * MAX_ACCELERATION * trajectoryDistance) /
    maxSpeedPx;
  targetFactor = Math.min(targetFactor, trajSpeedCeiling);

  // Comfort curve speed: a long raised-cosine bell into/out of the junction
  // plus a curvature-based safety cap, both frame-smoothed so the command
  // never steps. Rise is much slower than fall — cars roll out of a turn.
  const curveRaw = curvatureSpeedFactorAhead(car, maxSpeedPx);
  const turnRaw = turnApproachCapFactor(car, maxSpeedPx);
  car.smoothedCurveCap = blendToward(car.smoothedCurveCap, curveRaw, TURN_CAP_SMOOTH_DOWN, TURN_CAP_SMOOTH_UP);
  car.smoothedTurnCap = blendToward(car.smoothedTurnCap, turnRaw, TURN_CAP_SMOOTH_DOWN, TURN_CAP_SMOOTH_UP);
  const curvatureCapFactor = Math.min(car.smoothedCurveCap, car.smoothedTurnCap);
  targetFactor = Math.min(targetFactor, curvatureCapFactor);
  const laneErrBeforeMove = laneCenterError(car);
  const onGrassBeforeMove = !isPointOnRoad(car.x, car.y);
  const roadEdgeSensorsBeforeMove = getRoadEdgeDistanceSensors(car);
  const headingLookahead50BeforeMove = getTargetHeadingLookaheadNorm(car, 50);
  const headingLookahead100BeforeMove = getTargetHeadingLookaheadNorm(car, 100);
  const neighborContextBeforeMove = getNeighborContext(car, allCars);
  const contextBeforeMove = {
    shouldStop,
    needsAggressive,
    laneErr: laneErrBeforeMove,
    onGrass: onGrassBeforeMove,
    roadEdgeSensors: roadEdgeSensorsBeforeMove,
    headingLookahead50Norm: headingLookahead50BeforeMove,
    headingLookahead100Norm: headingLookahead100BeforeMove,
    currentAcceleration: car.lastAccelDelta,
    neighborContext: neighborContextBeforeMove,
    isAtStopPoint,
    signedDistToYieldLineNorm,
    onMainRoad,
    isEllipseToVerticalLeft,
    isEllipseToVerticalRight,
    isVerticalToEllipseRight,
    isVerticalToEllipseLeft,
    isSameLaneAhead,
    overlapType,
    priorityStatus
  };
  const decisionInput = buildStateVector(car, contextBeforeMove);
  const heuristicTargetFactor = clamp(targetFactor, 0, 1);
  if (controllerMode === 'nn') {
    if (!isNetworkFinite(nn)) {
      recoverModel('invalid-weights-before-control');
      car.lastHeuristicLead = true;
    }
    policyInput = decisionInput;
    const { out } = networkForward(nn, policyInput);
    if (isFiniteArray(out) && Number.isFinite(out[0]) && Number.isFinite(out[1])) {
      policyMeanSpeed = 1 / (1 + Math.exp(-out[0]));
      policyMeanSteer = Math.tanh(out[1]);
      const sigma = Math.max(RL_SIGMA_MIN, rlAdaptiveSigma);
      const sampledSpeed = isRLRunning ? policyMeanSpeed + randn() * sigma : policyMeanSpeed;
      const sampledSteer = isRLRunning ? policyMeanSteer + randn() * sigma : policyMeanSteer;
      if (Number.isFinite(policyMeanSpeed) && Number.isFinite(policyMeanSteer) &&
          Number.isFinite(sampledSpeed) && Number.isFinite(sampledSteer)) {
        policySampleSpeed = clamp(sampledSpeed, 0, 1);
        policySampleSteer = clamp(sampledSteer, -1, 1);
        targetFactor = clamp(policySampleSpeed, 0, 1);
        car.lastHeuristicLead = false;
        // Blend / clamp toward the heuristic so a half-trained clone cannot ignore
        // a yield or steer off the pavement (these caps existed but were never applied).
        const minEdge = Math.min(...roadEdgeSensorsBeforeMove);
        const edgeDanger = clamp(1 - minEdge, 0, 1);
        const laneDanger = clamp(laneErrBeforeMove / Math.max(1e-3, NN_SAFETY_MAX_LANE_ERR), 0, 1);
        const mustHonorStop =
          shouldStop ||
          (hadPriorityConflict && car.isYielding && !car.isCommittedToTurn) ||
          collisionSlowdown <= 0.001;
        const unsafe = onGrassBeforeMove || laneDanger > 0.55 || edgeDanger > 0.55;
        let blend = isRLRunning ? NN_BLEND_WHILE_RL : NN_BLEND_INFERENCE;
        if (rlRecoveryStepsRemaining > 0) blend = Math.min(blend, RL_RECOVERY_BLEND + 0.25);
        if (unsafe) blend *= 0.25;
        if (mustHonorStop) blend = 0;
        targetFactor = heuristicTargetFactor * (1 - blend) + targetFactor * blend;
        if (mustHonorStop) {
          targetFactor = Math.min(targetFactor, heuristicTargetFactor);
        } else {
          const maxDev = isRLRunning ? RL_MAX_SPEED_DEV_FROM_HEURISTIC : RL_MAX_SPEED_DEV_FROM_HEURISTIC * 0.75;
          targetFactor = clamp(
            targetFactor,
            heuristicTargetFactor - maxDev,
            heuristicTargetFactor + maxDev
          );
        }
        targetFactor = clamp(targetFactor, 0, 1);
        policySampleSpeed = targetFactor;
      } else {
        recoverModel('invalid-sampled-action');
        policyInput = null;
        policyMeanSpeed = null;
        policyMeanSteer = null;
        policySampleSpeed = null;
        policySampleSteer = null;
        targetFactor = heuristicTargetFactor;
        car.lastHeuristicLead = true;
      }
    } else {
      recoverModel('invalid-forward-control');
      policyInput = null;
      policyMeanSpeed = null;
      policyMeanSteer = null;
      policySampleSpeed = null;
      policySampleSteer = null;
      targetFactor = heuristicTargetFactor;
      car.lastHeuristicLead = true;
    }
  } else {
    car.lastHeuristicLead = true;
  }

  if (!Number.isFinite(targetFactor)) {
    logModelIssue(`${carName} targetFactor invalid; fallback to heuristic`);
    targetFactor = heuristicTargetFactor;
    car.lastHeuristicLead = true;
  }
  targetFactor = Math.min(targetFactor, trajSpeedCeiling);
  targetFactor = Math.min(targetFactor, curvatureCapFactor);

  // Jerk-limited speed command: S-curve accel/decel for comfort, emergency only
  // when impact is imminent. Acceleration itself ramps, so throttle/brake never
  // slam from zero to max in a single frame.
  const imminentStop =
    (Number.isFinite(defensiveHitDist) && defensiveHitDist <= CAR_LENGTH * 0.75) ||
    (hasFollowingConflict && Number.isFinite(leadGapPx) && leadGapPx < CAR_LENGTH * 0.3) ||
    (collisionSlowdown <= 0.001 && car.currentSpeedFactor > 0.55);
  const conflictSeverity = clamp(
    Math.max(
      needsAggressive,
      hadPriorityConflict ? 0.45 : 0,
      hasFollowingConflict ? followRisk : 0,
      collisionSlowdown < 1 ? (1 - collisionSlowdown) : 0
    ),
    0,
    1
  );
  const decelFactor = imminentStop
    ? EMERGENCY_DECEL_FACTOR
    : (COMFORT_DECEL_FACTOR + conflictSeverity * (AGGRESSIVE_DECELERATION_FACTOR - COMFORT_DECEL_FACTOR));
  const dt = Number.isFinite(simDtScale) ? simDtScale : 1;
  const accelStep = (MAX_ACCELERATION * COMFORT_ACCEL_FACTOR) / maxSpeedPx * dt;
  const decelStep = (MAX_ACCELERATION * decelFactor) / maxSpeedPx * dt;

  let desiredFactor = targetFactor;
  const nearStopLineForHold =
    shouldStop &&
    hadPriorityConflict &&
    !car.isCommittedToTurn &&
    Number.isFinite(signedDistToYieldLine) &&
    signedDistToYieldLine <= RULE6_STOP_LINE_TOLERANCE;
  if ((isAtYieldLine && shouldStop) || nearStopLineForHold || collisionSlowdown <= 0.001) {
    desiredFactor = 0;
  }
  desiredFactor = clamp(desiredFactor, 0, 1);

  if (!Number.isFinite(car.cmdSpeedFactor)) car.cmdSpeedFactor = car.currentSpeedFactor;
  if (!Number.isFinite(car.speedAccel)) car.speedAccel = 0;

  if (Number.isFinite(car.turnExitRemainPx) && car.turnExitRemainPx > 0) {
    const railNow = rails[car.railId];
    if (!railNow || railNow.kind !== 'connector') {
      const ds = Math.max(0.8, car.currentSpeedFactor * maxSpeedPx);
      car.turnExitRemainPx = Math.max(0, car.turnExitRemainPx - ds);
    }
  }

  if (controllerMode !== 'nn' || shouldStop || hadPriorityConflict) {
    const error = desiredFactor - car.currentSpeedFactor;
    let desiredAccel;
    if (error < 0) {
      desiredAccel = clamp(error * 0.15, -decelStep, 0);
    } else {
      // Slightly softer proportional gain on the way up so the exit of a turn
      // keeps rolling on rather than snapping to the cruise ceiling.
      desiredAccel = clamp(error * 0.085, 0, accelStep);
    }
    if (imminentStop) {
      car.speedAccel = -decelStep;
    } else {
      const jerk = SPEED_JERK_COMFORT * dt;
      car.speedAccel += clamp(desiredAccel - car.speedAccel, -jerk, jerk);
      car.speedAccel = clamp(car.speedAccel, -decelStep, accelStep);
    }

    let next = car.currentSpeedFactor + car.speedAccel;
    if (car.speedAccel < 0) next = Math.max(desiredFactor, next);
    else next = Math.min(desiredFactor, next);
    next = clamp(next, 0, 1);

    const hardHold = desiredFactor <= 0.001 && (
      imminentStop ||
      ((isAtYieldLine && shouldStop) || nearStopLineForHold || collisionSlowdown <= 0.001) &&
      car.currentSpeedFactor < 0.12
    );
    if (hardHold && car.currentSpeedFactor < 0.12) {
      next = 0;
      car.speedAccel = 0;
    } else if (Math.abs(desiredFactor - next) < 0.003 && Math.abs(car.speedAccel) < 0.0008) {
      next = desiredFactor;
      car.speedAccel = 0;
    }

    car.cmdSpeedFactor = next;
    car.currentSpeedFactor = next;
    if (desiredFactor <= 0.001 && car.currentSpeedFactor < 0.03) {
      car.currentSpeedFactor = 0;
      car.cmdSpeedFactor = 0;
      car.speedAccel = 0;
    }
  } else {
    // NN path: keep previous simple tracking toward targetFactor.
    let accel = MAX_ACCELERATION * COMFORT_ACCEL_FACTOR;
    if (needsAggressive) accel *= AGGRESSIVE_DECELERATION_FACTOR;
    const speedStep = accel / maxSpeedPx * dt;
    if (car.currentSpeedFactor < targetFactor) {
      car.currentSpeedFactor = Math.min(targetFactor, car.currentSpeedFactor + speedStep);
    } else {
      car.currentSpeedFactor += (targetFactor - car.currentSpeedFactor) * dtRate(SPEED_SMOOTHING_FACTOR);
    }
    car.cmdSpeedFactor = car.currentSpeedFactor;
    car.speedAccel = 0;
  }
  if (!Number.isFinite(car.currentSpeedFactor)) {
    logModelIssue(`${carName} speed factor invalid; clamping to heuristic`);
    car.currentSpeedFactor = heuristicTargetFactor;
  }
  car.currentSpeedFactor = clamp(car.currentSpeedFactor, 0, 1);

  /* ----------  Path guidance (shared with trajectory prediction)  ---------- */
  ({ targetX, targetY } = applyPathGuidance(car));
  const heuristicTargetSteer = computeTargetSteerAngle(car, targetX, targetY);
  const onTurnConnector = !!(rails[car.railId] && rails[car.railId].kind === 'connector');
  const steerBlend = onTurnConnector ? STEERING_SMOOTHING_TURN : STEERING_SMOOTHING_FACTOR;
  if (!Number.isFinite(car.smoothedSteer)) car.smoothedSteer = heuristicTargetSteer;
  car.smoothedSteer += (heuristicTargetSteer - car.smoothedSteer) * dtRate(steerBlend);
  car.targetSteerAngle = car.smoothedSteer;
  if (controllerMode === 'nn' && policyMeanSteer !== null) {
    const nnSteerAngle = policySampleSteer * SYMMETRIC_MAX_TURN_STEER_ANGLE;
    const minEdge = Math.min(...roadEdgeSensorsBeforeMove);
    const edgeDanger = clamp(1 - minEdge, 0, 1);
    const laneDanger = clamp(laneErrBeforeMove / Math.max(1e-3, NN_SAFETY_MAX_LANE_ERR), 0, 1);
    let blend = isRLRunning ? NN_BLEND_WHILE_RL : NN_BLEND_INFERENCE;
    if (rlRecoveryStepsRemaining > 0) blend = Math.min(blend, RL_RECOVERY_BLEND + 0.2);
    if (onGrassBeforeMove) blend = 0;
    else if (laneDanger > 0.7 || edgeDanger > 0.6) blend *= 0.15;
    else if (laneDanger > 0.4 || edgeDanger > 0.4) blend *= 0.4;
    let mixedSteer = heuristicTargetSteer * (1 - blend) + nnSteerAngle * blend;
    const maxSteerDev = SYMMETRIC_MAX_TURN_STEER_ANGLE * RL_MAX_STEER_DEV_FROM_HEURISTIC;
    mixedSteer = clamp(mixedSteer, heuristicTargetSteer - maxSteerDev, heuristicTargetSteer + maxSteerDev);
    car.targetSteerAngle = clamp(mixedSteer, -SYMMETRIC_MAX_TURN_STEER_ANGLE, SYMMETRIC_MAX_TURN_STEER_ANGLE);
  }

  const targetSpeed = heuristicTargetFactor;
  const targetSteer = clamp(heuristicTargetSteer / SYMMETRIC_MAX_TURN_STEER_ANGLE, -1, 1);
  const imitationSample = {
    input: decisionInput,
    target: [targetSpeed, targetSteer],
    shouldStop: !!shouldStop,
    isYielding: !!car.isYielding,
    onGrass: !!onGrassBeforeMove,
    laneErr: laneErrBeforeMove,
    turning: !!(car.isMakingTurn || car.turnState === 'approaching' || car.turnState === 'rejoining')
  };
  car.lastHeuristicSample = imitationSample;
  if (!Array.isArray(car.recentHeuristicSamples)) car.recentHeuristicSamples = [];
  car.recentHeuristicSamples.push({
    input: decisionInput.slice(),
    target: [targetSpeed, targetSteer],
    shouldStop: imitationSample.shouldStop,
    isYielding: imitationSample.isYielding,
    onGrass: imitationSample.onGrass,
    laneErr: imitationSample.laneErr,
    turning: imitationSample.turning
  });
  if (car.recentHeuristicSamples.length > RL_RECOVERY_CRASH_SEQUENCE_FRAMES) {
    car.recentHeuristicSamples.shift();
  }
  pushImitationSample(imitationSample);

  updateCarPhysics(car, car.maximumSpeed * 50 * car.currentSpeedFactor * dt);
  const clampedX = Math.max(0, Math.min(canvas.width, car.x));
  const clampedY = Math.max(0, Math.min(canvas.height, car.y));
  if (clampedX !== car.x || clampedY !== car.y || !Number.isFinite(clampedX) || !Number.isFinite(clampedY)) {
    car.x = Number.isFinite(clampedX) ? clampedX : centerX;
    car.y = Number.isFinite(clampedY) ? clampedY : centerY;
    rebuildCarGeometryFromCenter(car);
  } else {
    car.x = clampedX;
    car.y = clampedY;
  }
  car.lastRuleViolation = violatedYieldRule;

  const laneErr = laneCenterError(car);
  const onGrass = !isPointOnRoad(car.x, car.y);
  const neighborContextAfterMove = getNeighborContext(car, allCars);
  const speedDelta = car.currentSpeedFactor - car.prevSpeedFactor;
  const accelJerk = Math.abs(speedDelta - car.lastAccelDelta);
  car.lastAccelDelta = speedDelta;
  car.prevSpeedFactor = car.currentSpeedFactor;

  let reward = 0;
  const currentVelAfterMove = car.maximumSpeed * 50 * car.currentSpeedFactor;
  reward += car.currentSpeedFactor * 0.02;
  reward -= onGrass ? 3.2 : 0.0;
  if (onGrass) {
    reward -= clamp(laneErr / (LANE_CENTER_OFFSET), 0, 3) * 0.4;
  }
  reward -= clamp(laneErr / (ROAD_WIDTH / 3), 0, 2.5) * 0.35;
  reward -= clamp(accelJerk / 0.10, 0, 3.0) * JERK_PENALTY_BASE;
  reward -= followRisk * 0.9;
  reward -= neighborContextAfterMove.minTtcRisk * 0.55;
  reward -= neighborContextAfterMove.conflictTtcRisk * 1.2;
  reward -= neighborContextAfterMove.leadTtcRisk * 0.30;
  reward -= car.lastRuleViolation ? 0.8 : 0;

  // Rule 1: maintain safe speed relative to lead and stop with 0.5-1.0 car lengths when queued.
  if (hasLeadVehicle) {
    const effectiveStopDistance = clamp(leadGapPx, 0, trajectoryDistance);
    const maxFollowVel = Math.sqrt(2 * MAX_ACCELERATION * Math.max(0.001, effectiveStopDistance));
    const followSpeedExcess = Math.max(0, currentVelAfterMove - maxFollowVel);
    reward -= clamp(followSpeedExcess / Math.max(0.001, car.maximumSpeed * 50), 0, 2.0) * 0.9;
  }
  if (hasLeadVehicle && car.currentSpeedFactor < 0.06 && hasFollowingConflict) {
    const tooClose = Math.max(0, RULE1_STOP_GAP_MIN - leadGapPx);
    const tooFar = Math.max(0, leadGapPx - RULE1_STOP_GAP_MAX);
    const stopGapPenalty = clamp(tooClose / RULE1_STOP_GAP_MIN, 0, 2) + clamp(tooFar / (RULE1_STOP_GAP_MAX * 1.5), 0, 1.5);
    const stopGapWeight = 0.55 * (car.path === 'vertical' ? VERTICAL_STOP_GAP_PENALTY_MULTIPLIER : 1);
    reward -= stopGapPenalty * stopGapWeight;
  }

  // Rule 5: approaching crossroad must preserve ability to stop at stop line.
  const isApproachingYieldLine = !car.isCommittedToTurn &&
                                 (car.turnState === 'approaching' || car.turnState === 'rejoining') &&
                                 Number.isFinite(signedDistToYieldLine) &&
                                 signedDistToYieldLine > 0 &&
                                 signedDistToYieldLine <= trajectoryDistance;
  if (isApproachingYieldLine) {
    const maxApproachVel = Math.sqrt(2 * MAX_ACCELERATION * signedDistToYieldLine);
    const approachSpeedExcess = Math.max(0, currentVelAfterMove - maxApproachVel);
    reward -= clamp(approachSpeedExcess / Math.max(0.001, car.maximumSpeed * 50), 0, 2.0) * 1.1;
    reward -= clamp(accelJerk / 0.08, 0, 3.0) * JERK_PENALTY_YIELD_EXTRA;
  }

  // Encourage confident cruising on the main ellipse when far from crossroads and low-risk.
  const isEllipseCruiseZone = onMainRoad &&
                              !isNearTopCrossroad &&
                              !isNearBottomCrossroad &&
                              !car.isYielding &&
                              !hadPriorityConflict &&
                              !hasFollowingConflict &&
                              !isApproachingYieldLine;
  if (isEllipseCruiseZone) {
    const safetyGate = clamp(1 - neighborContextAfterMove.minTtcRisk * 1.2 - followRisk * 0.9, 0, 1);
    if (safetyGate > 0) {
      const cruiseReward = clamp(
        (car.currentSpeedFactor - ELLIPSE_CRUISE_MIN_SPEED) / Math.max(0.05, ELLIPSE_CRUISE_TARGET_SPEED - ELLIPSE_CRUISE_MIN_SPEED),
        0,
        1
      );
      const tooSlow = clamp((ELLIPSE_CRUISE_MIN_SPEED - car.currentSpeedFactor) / ELLIPSE_CRUISE_MIN_SPEED, 0, 1.5);
      reward += cruiseReward * ELLIPSE_CRUISE_REWARD_WEIGHT * safetyGate;
      reward -= tooSlow * ELLIPSE_CRUISE_SLOW_PENALTY * safetyGate;
    }
  }

  // Rule 6: if yielding, stop near the designated stop line with strong preference for exact alignment.
  if (car.isYielding && hadPriorityConflict && car.currentSpeedFactor < 0.06 && Number.isFinite(signedDistToYieldLine)) {
    const stopLineOffset = signedDistToYieldLine;
    const gaussian = Math.exp(-(stopLineOffset * stopLineOffset) / (2 * RULE6_STOP_GAUSSIAN_SIGMA * RULE6_STOP_GAUSSIAN_SIGMA));
    reward += gaussian * RULE6_STOP_LINE_GAUSSIAN_BONUS;
    const earlyOffset = Math.max(0, stopLineOffset - RULE6_STOP_LINE_TOLERANCE);
    const lateOffset = Math.max(0, -stopLineOffset - RULE6_STOP_LINE_TOLERANCE);
    reward -= clamp(earlyOffset / CAR_LENGTH, 0, 2.5) * RULE6_STOP_LINE_EARLY_PENALTY;
    reward -= clamp(lateOffset / CAR_LENGTH, 0, 2.5) * RULE6_STOP_LINE_LATE_PENALTY;
  }

  const yieldProximity = Number.isFinite(yieldConflictMinDist)
    ? clamp(1 - yieldConflictMinDist / TRAJECTORY_LOOKAHEAD_DISTANCE, 0, 1)
    : 0;
  if (yieldRule_2_1_2 || yieldRule_2_2_1) {
    reward -= yieldProximity * car.currentSpeedFactor * 1.5;
  } else if (yieldRule_2_1_1) {
    reward -= yieldProximity * car.currentSpeedFactor * 1.2;
  } else if (yieldRule_2_2_2) {
    reward -= yieldProximity * car.currentSpeedFactor * 1.35;
  } else if (yieldRule_rejoin) {
    reward -= yieldProximity * car.currentSpeedFactor * 1.3;
  }
  reward += car.pendingCrashPenalty;
  car.pendingCrashPenalty = 0;
  car.lastReward = reward;
  car.lastOnGrass = onGrass;
  logAccumulator.carsSeen += 1;
  logAccumulator.rewardSum += reward;
  logAccumulator.speedSum += car.currentSpeedFactor;
  logAccumulator.laneErrSum += laneErr;
  logAccumulator.accelJerkSum += accelJerk;
  if (onGrass) logAccumulator.grassCount += 1;
  if (car.lastRuleViolation) {
    logAccumulator.ruleViolations += 1;
    frameRuleViolationCount += 1;
  }

  if (controllerMode === 'nn') {
    car.lastPolicyTransition = {
      input: policyInput || decisionInput,
      meanSpeed: policyMeanSpeed !== null ? policyMeanSpeed : targetSpeed,
      meanSteer: policyMeanSteer !== null ? policyMeanSteer : targetSteer,
      sampleSpeed: policySampleSpeed !== null ? policySampleSpeed : targetSpeed,
      sampleSteer: policySampleSteer !== null ? policySampleSteer : targetSteer,
      sigma: Math.max(RL_SIGMA_MIN, rlAdaptiveSigma)
    };
  } else {
    car.lastPolicyTransition = null;
  }

  // Forensic decision snapshot used by crash reports (pre-move decision + post-move outcome).
  pushCarDebugHistory(car, {
    shouldStop,
    isYielding: !!car.isYielding,
    hadPriorityConflict,
    hasFollowingConflict,
    collisionSlowdown: roundDebug(collisionSlowdown, 3),
    heuristicTargetFactor: roundDebug(heuristicTargetFactor, 3),
    appliedTargetFactor: roundDebug(targetFactor, 3),
    needsAggressive: roundDebug(needsAggressive, 3),
    leadGapPx: Number.isFinite(leadGapPx) ? roundDebug(leadGapPx) : null,
    leadSpeedFactor: Number.isFinite(leadSpeedFactor) ? roundDebug(leadSpeedFactor, 3) : null,
    yieldRules: {
      following: !!hasFollowingConflict,
      r211: !!yieldRule_2_1_1,
      r212: !!yieldRule_2_1_2,
      r221: !!yieldRule_2_2_1,
      r222: !!yieldRule_2_2_2,
      rejoin: !!yieldRule_rejoin
    },
    yieldTargets: yieldTargets.slice(),
    yieldConflictMinDist: Number.isFinite(yieldConflictMinDist) && yieldConflictMinDist < Infinity
      ? roundDebug(yieldConflictMinDist)
      : null,
    defensiveHitDist: Number.isFinite(defensiveHitDist) && defensiveHitDist < Infinity
      ? roundDebug(defensiveHitDist)
      : null,
    defensiveOtherId,
    defensiveBrake: !!defensiveBrake,
    signedDistToYieldLine: Number.isFinite(signedDistToYieldLine) ? roundDebug(signedDistToYieldLine) : null,
    isAtYieldLine: !!isAtYieldLine,
    isAtStopPoint: !!isAtStopPoint,
    violatedYieldRule: !!violatedYieldRule,
    yieldTimeoutFired: !!yieldTimeoutFired,
    overlapType,
    isNearTopCrossroad: !!isNearTopCrossroad,
    isNearBottomCrossroad: !!isNearBottomCrossroad,
    distToVerticalJunction: Number.isFinite(distToVerticalJunction) ? roundDebug(distToVerticalJunction) : null,
    trajectoryDistance: roundDebug(trajectoryDistance),
    followRisk: roundDebug(followRisk, 3),
    closingRateVsLead: roundDebug(closingRate, 3),
    laneErr: roundDebug(laneErr),
    onGrass: !!onGrass,
    reward: roundDebug(reward, 3)
  });
}

  function assignCrashPenalties() {
    const allCars = [car1, car2, car3, car4, car5, car6];
    frameCrashDetails = [];
    for (let i = 0; i < allCars.length; i++) {
      for (let j = i + 1; j < allCars.length; j++) {
        const a = allCars[i];
        const b = allCars[j];
        const boxA = getCarBoundingBox(a);
        const boxB = getCarBoundingBox(b);
        if (!checkPolygonIntersection(boxA, boxB)) continue;

        const sameVerticalLane = a.path === 'vertical' &&
          b.path === 'vertical' &&
          a.verticalDirection !== null &&
          a.verticalDirection === b.verticalDirection;
        const aAhead = sameVerticalLane && (
          (a.verticalDirection === 'up' && a.y < b.y) ||
          (a.verticalDirection === 'down' && a.y > b.y)
        );
        const bAhead = sameVerticalLane && (
          (b.verticalDirection === 'up' && b.y < a.y) ||
          (b.verticalDirection === 'down' && b.y > a.y)
        );
        let verticalRearEnd = false;
        if (sameVerticalLane && (aAhead || bAhead)) {
          frameVerticalRearEndPairs += 1;
          logAccumulator.verticalRearEndPairs += 1;
          verticalRearEnd = true;
        }

        const aViolator = a.lastRuleViolation;
        const bViolator = b.lastRuleViolation;
        a.crashThisFrame = true;
        b.crashThisFrame = true;
        frameCrashPairs += 1;
        logAccumulator.crashPairs += 1;
        frameCrashDetails.push({ a, b, verticalRearEnd, aViolator: !!aViolator, bViolator: !!bViolator });
        if (aViolator && !bViolator) {
          a.pendingCrashPenalty -= 8.0;
          logAccumulator.violatorCrashPairs += 1;
        } else if (bViolator && !aViolator) {
          b.pendingCrashPenalty -= 8.0;
          logAccumulator.violatorCrashPairs += 1;
        } else if (aViolator && bViolator) {
          a.pendingCrashPenalty -= 7.0;
          b.pendingCrashPenalty -= 7.0;
          logAccumulator.violatorCrashPairs += 1;
        } else {
          a.pendingCrashPenalty -= 3.0;
          b.pendingCrashPenalty -= 3.0;
        }
      }
    }
  }

  // Function to draw crossroad areas for debugging
  
  // One physics update per display frame, scaled to wall-clock so 60Hz and
  // 144Hz look the same speed. Never run extra catch-up steps — that is what
  // made the whole scene slow down then surge. A hitch drops time instead.
  const SIM_STEP_MS = 1000 / 60;
  let simDtScale = 1;
  let lastSimFrameTimeMs = null;
  let renderAlpha = 1;
  function snapshotRenderPoses() {
    const allCars = [car1, car2, car3, car4, car5, car6];
    for (const car of allCars) {
      car.prevPoseX = car.x;
      car.prevPoseY = car.y;
      car.prevPoseHeading = car.heading;
    }
  }

  function gameLoop(timestamp) {
    if (!isSimulationRunning) {
      lastSimFrameTimeMs = null;
      return;
    }
    if (typeof timestamp !== 'number' || !Number.isFinite(timestamp)) {
      timestamp = performance.now();
    }
    if (lastSimFrameTimeMs === null) {
      lastSimFrameTimeMs = timestamp;
      snapshotRenderPoses();
      simDtScale = 1;
      update();
      renderAlpha = 1;
      draw();
      animationFrameId = requestAnimationFrame(gameLoop);
      return;
    }
    let elapsedMs = timestamp - lastSimFrameTimeMs;
    lastSimFrameTimeMs = timestamp;
    if (!Number.isFinite(elapsedMs) || elapsedMs < 0) elapsedMs = 0;
    // Cap at ~30Hz worth of time so a GC pause does not teleport, and never
    // banks leftover time into a later burst.
    elapsedMs = Math.min(elapsedMs, SIM_STEP_MS * 2);

    simDtScale = elapsedMs / SIM_STEP_MS;
    snapshotRenderPoses();
    update();
    renderAlpha = 1;
    draw();

    animationFrameId = requestAnimationFrame(gameLoop);
  }

  function draw() {
    renderThreeScene();
  }

  function update() {
    simFrame++;
    logAccumulator.frames++;
    frameCrashPairs = 0;
    frameVerticalRearEndPairs = 0;
    frameGrassCount = 0;
    frameRuleViolationCount = 0;
    const allCars = [car1, car2, car3, car4, car5, car6];
    for (const car of allCars) {
      car.crashThisFrame = false;
    }

    // Break multi-car freezes before control (avgSpeed→0 gridlocks).
    resolveGridlock(allCars);

    updateCar(car1);
    updateCar(car2);
    updateCar(car3);
    updateCar(car4);
    updateCar(car5);
    updateCar(car6);
    for (const car of allCars) {
      if (car.lastOnGrass) frameGrassCount++;
    }
    assignCrashPenalties();
    rlCrashEMA = rlCrashEMA * 0.98 + frameCrashPairs * 0.02;
    rlGrassEMA = rlGrassEMA * 0.98 + frameGrassCount * 0.02;
    if (isRLRunning && frameCrashPairs > 0) {
      rlRecoveryStepsRemaining = Math.max(rlRecoveryStepsRemaining, RL_RECOVERY_STEPS_ON_CRASH);
      const crashedCars = allCars.filter(c => c.crashThisFrame);
      const heuristicLeadCrashes = crashedCars.filter(c => c.lastHeuristicLead).length;
      const heuristicLeadRatio = heuristicLeadCrashes / Math.max(1, crashedCars.length);
      const adjusted = RL_RECOVERY_BC_MULTIPLIER * (1 - 0.65 * heuristicLeadRatio);
      rlRecoveryBcMultiplierDynamic = clamp(adjusted, 1, RL_RECOVERY_BC_MULTIPLIER);
    }
    if (isRLRunning && frameGrassCount >= RL_GRASS_TRIGGER_COUNT) {
      rlRecoveryStepsRemaining = Math.max(rlRecoveryStepsRemaining, RL_RECOVERY_STEPS_ON_GRASS);
      rlAdaptiveSigma = Math.max(RL_SIGMA_MIN, rlAdaptiveSigma * 0.9);
    }
    if (rlRecoveryStepsRemaining <= 0) {
      rlRecoveryBcMultiplierDynamic = RL_RECOVERY_BC_MULTIPLIER;
    }
    const rulePressure = clamp(frameRuleViolationCount / Math.max(1, allCars.length), 0, 1.5);
    const crashPressure = clamp(frameCrashPairs / 2.0, 0, 1.5);
    const grassPressure = clamp(frameGrassCount / Math.max(1, allCars.length), 0, 1.5);
    const instability = clamp(rulePressure * 0.9 + crashPressure * 0.95 + grassPressure * 0.55 + rlCrashEMA * 0.2, 0, 1.7);
    const replayBase = rlRecoveryStepsRemaining > 0 ? RL_RECOVERY_REPLAY_SCALE : 1;
    const replayTarget = replayBase * (1 + instability);
    rlReplayUpdateScale = clamp(
      rlReplayUpdateScale * 0.88 + replayTarget * 0.12,
      RL_REPLAY_SCALE_MIN,
      RL_REPLAY_SCALE_MAX
    );
    const trajectoryTarget = rlRecoveryStepsRemaining > 0 ? RECOVERY_TRAJECTORY_LENGTH : BASE_TRAJECTORY_LENGTH;
    activeTrajectoryLength = clamp(
      activeTrajectoryLength * 0.92 + trajectoryTarget * 0.08,
      BASE_TRAJECTORY_LENGTH,
      RECOVERY_TRAJECTORY_LENGTH
    );

    if (isPreTraining) {
      runPretrainStep();
    }

    if (isRLRunning && controllerMode === 'nn') {
      let frameReward = 0;
      const pgScale = rlRecoveryStepsRemaining > 0 ? RL_RECOVERY_PG_SCALE : 1;
      const bcMultiplier = rlRecoveryStepsRemaining > 0 ? Math.max(1, Math.floor(rlRecoveryBcMultiplierDynamic)) : 1;
      for (const car of allCars) {
        rlBaselineEMA = rlStepCount === 0 ? car.lastReward : rlBaselineEMA * RL_BASELINE_DECAY + car.lastReward * (1 - RL_BASELINE_DECAY);
        const absDev = Math.abs(car.lastReward - rlBaselineEMA);
        rlRewardAbsDevEMA = rlStepCount === 0 ? Math.max(0.25, absDev) : rlRewardAbsDevEMA * 0.99 + Math.max(0.25, absDev) * 0.01;
        const pgReward =
          car.lastReward +
          (car.crashThisFrame ? RL_CRASH_REWARD_BONUS_PENALTY : 0) +
          (car.lastOnGrass ? -0.8 : 0);
        trainPolicyGradient(car.lastPolicyTransition, pgReward, RL_LR * pgScale);
        if (car.lastHeuristicSample) {
          for (let m = 0; m < bcMultiplier; m++) {
            trainNetworkSupervised(car.lastHeuristicSample, RL_BEHAVIOR_CLONE_LR);
          }
          if (car.lastOnGrass) {
            for (let g = 0; g < GRASS_CORRECTION_UPDATES; g++) {
              trainNetworkSupervised(car.lastHeuristicSample, GRASS_CORRECTION_LR);
            }
          }
          if (car.crashThisFrame) {
            for (let k = 0; k < CRASH_CORRECTION_UPDATES; k++) {
              trainNetworkSupervised(car.lastHeuristicSample, CRASH_CORRECTION_LR);
            }
            const recent = Array.isArray(car.recentHeuristicSamples) ? car.recentHeuristicSamples : [];
            const seqPasses = rlRecoveryStepsRemaining > 0 ? RL_RECOVERY_CRASH_SEQUENCE_PASSES + 1 : RL_RECOVERY_CRASH_SEQUENCE_PASSES;
            for (let pass = 0; pass < seqPasses; pass++) {
              for (const seqSample of recent) {
                trainNetworkSupervised(seqSample, RL_RECOVERY_CRASH_SEQUENCE_LR);
              }
            }
          }
        }
        const replayReward = pgReward;
        pushReplayTransition(car.lastPolicyTransition, replayReward, car.crashThisFrame);
        frameReward += replayReward;
      }
      runReplayUpdates();
      rlStepCount++;
      const meanFrameReward = frameReward / allCars.length;
      rlRewardEMA = rlStepCount === 1 ? meanFrameReward : rlRewardEMA * 0.97 + meanFrameReward * 0.03;
      if (rlRecoveryStepsRemaining > 0) {
        rlRecoveryStepsRemaining--;
      }
    }

    if (frameCrashPairs > 0) {
      const now = performance.now();
      if (DEBUG_LOG && now - lastCrashEventLogMs > 900) {
        logEvent('behavior', `crash event detected this frame-window: pairs=${frameCrashPairs}, verticalRearEnd=${frameVerticalRearEndPairs}, grassCars=${frameGrassCount}, recovery=${rlRecoveryStepsRemaining}`);
        lastCrashEventLogMs = now;
      }
      // Build full forensic report and pause (same as Stop Simulation button).
      if (crashPauseArmed && PAUSE_ON_CRASH) {
        const report = buildCrashReport(frameCrashDetails);
        // Draw the crashed frame once more so the user sees the collision pose.
        draw();
        pauseSimulationForCrash(report);
        return;
      }
    }

    if (performance.now() - lastStatusPanelRefreshMs >= 250) {
      lastStatusPanelRefreshMs = performance.now();
      refreshStatusPanel();
    }

    if (lastControllerMode !== controllerMode) {
      logEvent('lifecycle', `active controller: ${controllerMode}`);
      lastControllerMode = controllerMode;
    }
    if (lastPretrainState !== isPreTraining) {
      logEvent('lifecycle', `pre-train state changed -> ${isPreTraining ? 'running' : 'idle'}`);
      lastPretrainState = isPreTraining;
    }
    if (lastRLState !== isRLRunning) {
      logEvent('lifecycle', `RL state changed -> ${isRLRunning ? 'running' : 'idle'}`);
      lastRLState = isRLRunning;
    }
    if (!isPreTraining && pretrainSteps >= PRETRAIN_TARGET_STEPS && lastPretrainLogMs !== -1) {
      logEvent('training', `pre-train completed at ${pretrainSteps} steps; final lossEMA=${pretrainLossEMA.toFixed(5)}`);
      lastPretrainLogMs = -1;
    }
    if (!isPreTraining && lastPretrainLogMs === -1 && pretrainSteps < PRETRAIN_TARGET_STEPS) {
      lastPretrainLogMs = 0;
    }

    emitPeriodicLogs();
  }

  function toggleSimulation() {
    if (isSimulationRunning) {
      lastCrashPauseReason = null;
      setSimulationRunning(false, 'user stop');
    } else {
      // Resume re-arms crash pause so the next new crash will stop again.
      setSimulationRunning(true, lastCrashPauseReason ? 'after crash pause' : 'user resume');
    }
  }

  // --- Scene Setup panel wiring ---
  document.getElementById('dayNightSwitch').addEventListener('change', e => {
    sceneSetup.night = e.target.checked;
    document.getElementById('dayNightLabel').textContent = sceneSetup.night ? 'Night' : 'Day';
    applyDayNight();
  });
  document.getElementById('trajectoriesSwitch').addEventListener('change', e => {
    sceneSetup.showTrajectories = e.target.checked;
  });
  [
    ['lamppostsBrightness', 'lampposts'],
    ['headlightsBrightness', 'headlights'],
    ['blinkersBrightness', 'blinkers'],
    ['brakeLightsBrightness', 'brake']
  ].forEach(([inputId, key]) => {
    const input = document.getElementById(inputId);
    const valueLabel = document.getElementById(`${inputId}Value`);
    const apply = () => {
      sceneSetup.brightness[key] = input.value / 100;
      valueLabel.textContent = `${input.value}%`;
      if (key === 'lampposts') applyLampposts();
    };
    input.addEventListener('input', apply);
  });

  initThreeRenderer();
  resetSimulation();
</script>
</body>
</html>
