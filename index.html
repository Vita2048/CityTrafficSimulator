      rlBestNetworkSnapshot = cloneNetwork(nn);
      rlReplayUpdateScale = 1;
      rlRecoveryStepsRemaining = 0;
      activeTrajectoryLength = BASE_TRAJECTORY_LENGTH;
      rlCrashEMA = 0;
      rlGrassEMA = 0;
    }
    logEvent('lifecycle', `RL ${isRLRunning ? 'started' : 'stopped'} at updates=${rlStepCount}`);
    refreshStatusPanel();
  }

  function useNN() {
    setControllerMode('nn');
  }

  function useHeuristics() {
    setControllerMode('heuristics');
  }

  function refreshStatusPanel() {
    const preBtn = document.getElementById('pretrainButton');
    const rlBtn = document.getElementById('rlButton');
    const driverEl = document.getElementById('driverStatus');
    const simEl = document.getElementById('simStatus');
    const preEl = document.getElementById('pretrainStatus');
    const rlEl = document.getElementById('rlStatus');
    
    // Dot elements for status badges
    const driverDot = document.getElementById('driverStatusDot');
    const simDot = document.getElementById('simStatusDot');
    const preDot = document.getElementById('pretrainStatusDot');
    const rlDot = document.getElementById('rlStatusDot');

    // Controller Mode buttons active styling
    const useNNBtn = document.getElementById('useNNButton');
    const useHeuristicsBtn = document.getElementById('useHeuristicsButton');
    if (useNNBtn && useHeuristicsBtn) {
      if (controllerMode === 'nn') {
        useNNBtn.classList.add('active');
        useHeuristicsBtn.classList.remove('active');
      } else {
        useNNBtn.classList.remove('active');
        useHeuristicsBtn.classList.add('active');
      }
    }

    if (preBtn) preBtn.textContent = isPreTraining ? 'Stop Pre-Train' : 'Pre-Train NN';
    if (rlBtn) rlBtn.textContent = isRLRunning ? 'Stop RL' : 'Start RL';
    
    if (driverEl) {
      driverEl.textContent = controllerMode === 'nn' ? 'Neural Network' : 'Heuristics';
      if (driverDot) {
        driverDot.className = controllerMode === 'nn' ? 'status-dot active' : 'status-dot info';
      }
    }
    
    if (simEl) {
      if (!isSimulationRunning && lastCrashPauseReason) {
        simEl.textContent = `PAUSED on crash (frame ${simFrame}) — Resume or Reset`;
        simEl.classList.add('crash');
        if (simDot) simDot.className = 'status-dot crash';
      } else if (!isSimulationRunning) {
        simEl.textContent = 'Paused';
        simEl.classList.remove('crash');
        if (simDot) simDot.className = 'status-dot idle';
      } else {
        simEl.textContent = `Running (frame ${simFrame})`;
        simEl.classList.remove('crash');
        if (simDot) simDot.className = 'status-dot active';
      }
    }
    
    if (preEl) {
      const pct = clamp((pretrainSteps / PRETRAIN_TARGET_STEPS) * 100, 0, 100);
      preEl.textContent = isPreTraining
        ? `Running (${pretrainSteps}/${PRETRAIN_TARGET_STEPS}, ${pct.toFixed(1)}%, loss ${pretrainLossEMA.toFixed(4)})`
        : pretrainSteps >= PRETRAIN_TARGET_STEPS
          ? `Completed (${PRETRAIN_TARGET_STEPS} steps)`
          : `Idle (${pretrainSteps}/${PRETRAIN_TARGET_STEPS} prepared)`;
      
      if (preDot) {
        if (isPreTraining) {
          preDot.className = 'status-dot info';
        } else if (pretrainSteps >= PRETRAIN_TARGET_STEPS) {
          preDot.className = 'status-dot active';
        } else {
          preDot.className = 'status-dot';
        }
      }
    }
    
    if (rlEl) {
      if (isRLRunning && controllerMode !== 'nn') {
        rlEl.textContent = `Running, waiting for NN control (${rlStepCount} updates)`;
        if (rlDot) rlDot.className = 'status-dot idle';
      } else {
        rlEl.textContent = isRLRunning
          ? `Running (${rlStepCount} updates, reward EMA ${rlRewardEMA.toFixed(3)})`
          : `Idle (${rlStepCount} updates)`;
        
        if (rlDot) {
          rlDot.className = isRLRunning ? 'status-dot active' : 'status-dot';
        }
      }
    }
  }

  function emitPeriodicLogs() {
    if (!DEBUG_LOG) return;
    const now = performance.now();

    if (isPreTraining && LOG_CONFIG.training && now - lastPretrainLogMs >= LOG_CONFIG.trainingIntervalMs) {
      const pct = clamp((pretrainSteps / PRETRAIN_TARGET_STEPS) * 100, 0, 100);
      logEvent('training', `pretrain step=${pretrainSteps}/${PRETRAIN_TARGET_STEPS} (${pct.toFixed(1)}%) lossEMA=${pretrainLossEMA.toFixed(5)} buffer=${trainingBuffer.length} critical=${criticalTrainingBuffer.length}`);
      lastPretrainLogMs = now;
    }

    if (isRLRunning && controllerMode === 'nn' && LOG_CONFIG.rl && now - lastRLLogMs >= LOG_CONFIG.rlIntervalMs) {
      logEvent('rl', `updates=${rlStepCount} rewardEMA=${rlRewardEMA.toFixed(4)} baseline=${rlBaselineEMA.toFixed(4)} advEMA=${rlAdvantageEMA.toFixed(4)} sigma=${rlAdaptiveSigma.toFixed(3)} crashEMA=${rlCrashEMA.toFixed(3)} grassEMA=${rlGrassEMA.toFixed(3)} recovery=${rlRecoveryStepsRemaining} replayScale=${rlReplayUpdateScale.toFixed(2)} trajLen=${activeTrajectoryLength.toFixed(2)} lr=${RL_LR}`);
      lastRLLogMs = now;
    }

    if (LOG_CONFIG.behavior && now - lastBehaviorLogMs >= LOG_CONFIG.behaviorIntervalMs && logAccumulator.frames > 0) {
      const cars = Math.max(1, logAccumulator.carsSeen);
      const avgReward = logAccumulator.rewardSum / cars;
      const avgSpeedFactor = logAccumulator.speedSum / cars;
      const avgLaneErr = logAccumulator.laneErrSum / cars;
      const avgJerk = logAccumulator.accelJerkSum / cars;
      const score = avgReward - logAccumulator.crashPairs * 0.007 - logAccumulator.grassCount * 0.0006 - logAccumulator.ruleViolations * 0.0005;
      const catastrophic = logAccumulator.crashPairs > 70 || logAccumulator.ruleViolations > 220 || avgReward < -0.45;
      if (isRLRunning && controllerMode === 'nn') {
        if (catastrophic) {
          rlAdaptiveSigma = Math.max(RL_SIGMA_MIN, rlAdaptiveSigma * 0.85);
          if (rlBestNetworkSnapshot) {
            copyNetworkInto(nn, rlBestNetworkSnapshot);
            logEvent('rl', `rollback to best checkpoint due to instability (score=${score.toFixed(4)}, crashes=${logAccumulator.crashPairs}, ruleViol=${logAccumulator.ruleViolations})`);
          }
        } else {
          if (score > rlBestScore) {
            rlBestScore = score;
            rlBestNetworkSnapshot = cloneNetwork(nn);
            logEvent('rl', `new best checkpoint score=${rlBestScore.toFixed(4)} crashes=${logAccumulator.crashPairs}`);
          }
          rlAdaptiveSigma = Math.min(RL_SIGMA, rlAdaptiveSigma * 1.01);
        }
      }
      logEvent(
        'behavior',
        `mode=${controllerMode} frames=${logAccumulator.frames} avgReward=${avgReward.toFixed(4)} avgSpeed=${avgSpeedFactor.toFixed(3)} laneErr=${avgLaneErr.toFixed(2)} jerk=${avgJerk.toFixed(3)} grass=${logAccumulator.grassCount} ruleViol=${logAccumulator.ruleViolations} crashes=${logAccumulator.crashPairs} violatorCrashes=${logAccumulator.violatorCrashPairs} verticalRearEnd=${logAccumulator.verticalRearEndPairs}`
      );
      lastBehaviorLogMs = now;
      resetLogAccumulator();
    }
  }

  function isPointOnRoad(x, y) {
    const rxOuter = 560 + ROAD_WIDTH / 2;
    const ryOuter = 360 + ROAD_WIDTH / 2;
    const rxInner = 560 - ROAD_WIDTH / 2;
    const ryInner = 360 - ROAD_WIDTH / 2;
    const ellipseOuter = ((x - centerX) * (x - centerX)) / (rxOuter * rxOuter) + ((y - centerY) * (y - centerY)) / (ryOuter * ryOuter) <= 1;
    const ellipseInner = ((x - centerX) * (x - centerX)) / (rxInner * rxInner) + ((y - centerY) * (y - centerY)) / (ryInner * ryInner) >= 1;
    const verticalRoad = x >= centerX - ROAD_WIDTH / 2 && x <= centerX + ROAD_WIDTH / 2 && y >= 40 && y <= 760;
    return (ellipseOuter && ellipseInner) || verticalRoad;
  }

  function laneCenterError(car) {
    if (car.path === 'vertical') {
      const laneX = car.verticalDirection === 'up' ? UPWARD_LANE_X : DOWNWARD_LANE_X;
      return Math.abs(car.x - laneX);
    }
    const aTarget = car.direction === 1 ? 560 - LANE_CENTER_OFFSET : 560 + LANE_CENTER_OFFSET;
    const bTarget = car.direction === 1 ? 360 - LANE_CENTER_OFFSET : 360 + LANE_CENTER_OFFSET;
    const nx = (car.x - centerX) / aTarget;
    const ny = (car.y - centerY) / bTarget;
    const radialNorm = Math.sqrt(nx * nx + ny * ny);
    return Math.abs(radialNorm - 1) * ((aTarget + bTarget) * 0.5);
  }

  function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= 2 * Math.PI;
    while (angle < -Math.PI) angle += 2 * Math.PI;
    return angle;
  }

  function getRoadEdgeDistanceSensors(car) {
    const sensors = [];
    for (let i = 0; i < ROAD_EDGE_RAY_COUNT; i++) {
      const rayAngle = car.heading + (i * 2 * Math.PI) / ROAD_EDGE_RAY_COUNT;
      let dist = ROAD_EDGE_RAY_MAX_DISTANCE;
      for (let d = 0; d <= ROAD_EDGE_RAY_MAX_DISTANCE; d += ROAD_EDGE_RAY_STEP) {
        const sampleX = car.x + Math.cos(rayAngle) * d;
        const sampleY = car.y + Math.sin(rayAngle) * d;
        if (!isPointOnRoad(sampleX, sampleY)) {
          dist = d;
          break;
        }
      }
      sensors.push(clamp(dist / ROAD_EDGE_RAY_MAX_DISTANCE, 0, 1));
    }
    return sensors;
  }

  function getTargetHeadingLookaheadNorm(car, lookAheadDistance) {
    const { targetX, targetY } = getLookaheadPointForPrediction(car, lookAheadDistance);
    const dx = targetX - car.x;
    const dy = targetY - car.y;
    const targetHeading = (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) ? car.heading : Math.atan2(dy, dx);
    const headingError = normalizeAngle(targetHeading - car.heading);
    return clamp(headingError / Math.PI, -1, 1);
  }

  function computeLongitudinalTTC(car, otherCar) {
    const hx = Math.cos(car.heading);
    const hy = Math.sin(car.heading);
    const relX = otherCar.x - car.x;
    const relY = otherCar.y - car.y;
    const forwardDist = relX * hx + relY * hy;
    if (forwardDist <= 0) return Infinity;
    const myVel = car.maximumSpeed * 50 * car.currentSpeedFactor;
    const othVel = otherCar.maximumSpeed * 50 * otherCar.currentSpeedFactor;
    const relClosing = myVel - othVel;
    if (relClosing <= 0.01) return Infinity;
    return forwardDist / relClosing;
  }

  function isSameLaneFlow(car, otherCar) {
    if (car.path === 'vertical' && otherCar.path === 'vertical') {
      return car.verticalDirection !== null && car.verticalDirection === otherCar.verticalDirection;
    }
    if (car.path === 'ellipse' && otherCar.path === 'ellipse') {
      return car.direction === otherCar.direction && car.turnState !== 'rejoining' && otherCar.turnState !== 'rejoining';
    }
    return false;
  }

  function getNeighborContext(car, allCars) {
    let nearestCar = null;
    let nearestDist = Infinity;
    let nearestDx = 0;
    let nearestDy = 0;
    let nearestRelSpeed = 0;
    let leadGap = Infinity;
    let leadClosing = 0;
    let leadTTC = Infinity;
    let rearGap = Infinity;
    let rearClosing = 0;
    let conflictDist = Infinity;
    let conflictClosing = 0;
    let conflictTTC = Infinity;
    let nearbyCount = 0;
    let minTTC = Infinity;
    let priorityAdvantage = 0;

    for (const otherCar of allCars) {
      if (otherCar === car) continue;
      const dx = otherCar.x - car.x;
      const dy = otherCar.y - car.y;
      const dist = Math.hypot(dx, dy);
      if (dist < nearestDist) {
        nearestDist = dist;
        nearestCar = otherCar;
        nearestDx = dx;
        nearestDy = dy;
      }
      if (dist < TRAJECTORY_LOOKAHEAD_DISTANCE) nearbyCount++;

      const ttc = computeLongitudinalTTC(car, otherCar);
      if (ttc < minTTC) minTTC = ttc;

      if (isSameLaneFlow(car, otherCar)) {
        const dot = Math.cos(car.heading) * dx + Math.sin(car.heading) * dy;
        if (dot > 0 && dot < leadGap) {
          leadGap = dot;
          leadClosing = Math.max(0, car.currentSpeedFactor - otherCar.currentSpeedFactor);
          leadTTC = ttc;
        } else if (dot < 0 && -dot < rearGap) {
          rearGap = -dot;
          rearClosing = Math.max(0, otherCar.currentSpeedFactor - car.currentSpeedFactor);
        }
      } else if (dist < TRAJECTORY_LOOKAHEAD_DISTANCE && checkTrajectoryIntersection(car, otherCar)) {
        if (dist < conflictDist) {
          conflictDist = dist;
          conflictClosing = Math.max(0, car.currentSpeedFactor - otherCar.currentSpeedFactor);
          conflictTTC = ttc;
        }
      }
    }

    const nearestDistNorm = Number.isFinite(nearestDist) ? clamp(nearestDist / TRAJECTORY_LOOKAHEAD_DISTANCE, 0, 1) : 1;
    const nearestDxNorm = Number.isFinite(nearestDist) ? clamp(nearestDx / TRAJECTORY_LOOKAHEAD_DISTANCE, -1, 1) : 0;
    const nearestDyNorm = Number.isFinite(nearestDist) ? clamp(nearestDy / TRAJECTORY_LOOKAHEAD_DISTANCE, -1, 1) : 0;
    if (nearestCar) {
      nearestRelSpeed = clamp(car.currentSpeedFactor - nearestCar.currentSpeedFactor, -1, 1);
      if (car.path === 'ellipse' && nearestCar.path === 'vertical') {
        priorityAdvantage = 1;
      } else if (car.path === 'vertical' && nearestCar.path === 'ellipse') {
        priorityAdvantage = -1;
      }
    }

    const leadRisk = Number.isFinite(leadGap) ? clamp(1 - leadGap / (CAR_LENGTH * 4), 0, 1) : 0;
    const leadTtcRisk = Number.isFinite(leadTTC) ? clamp((4 - leadTTC) / 4, 0, 1) : 0;
    const rearRisk = Number.isFinite(rearGap) ? clamp(1 - rearGap / (CAR_LENGTH * 4), 0, 1) : 0;
    const conflictRisk = Number.isFinite(conflictDist) ? clamp(1 - conflictDist / TRAJECTORY_LOOKAHEAD_DISTANCE, 0, 1) : 0;
    const conflictTtcRisk = Number.isFinite(conflictTTC) ? clamp((4 - conflictTTC) / 4, 0, 1) : 0;
    const minTtcRisk = Number.isFinite(minTTC) ? clamp((4 - minTTC) / 4, 0, 1) : 0;
    const leadTtcNorm = normalizeTtcForState(leadTTC);
    const conflictTtcNorm = normalizeTtcForState(conflictTTC);
    const minTtcNorm = normalizeTtcForState(minTTC);

    return {
      nearestDistNorm,
      nearestDxNorm,
      nearestDyNorm,
      nearestRelSpeed,
      leadRisk,
      leadClosing: clamp(leadClosing, 0, 1),
      leadTtcRisk,
      rearRisk,
      rearClosing: clamp(rearClosing, 0, 1),
      conflictRisk,
      conflictClosing: clamp(conflictClosing, 0, 1),
      conflictTtcRisk,
      nearbyCountNorm: clamp(nearbyCount / 5, 0, 1),
      minTtcRisk,
      leadTtcNorm,
      conflictTtcNorm,
      minTtcNorm,
      priorityAdvantage
    };
  }

  function buildStateVector(car, context) {
    const speedNorm = clamp(car.currentSpeedFactor, 0, 1);
    const laneErrNorm = clamp(context.laneErr / (ROAD_WIDTH / 2), 0, 1);
    const turnCode = car.turnDirection === 'left' ? -1 : car.turnDirection === 'right' ? 1 : 0;
    const pathCode = car.path === 'vertical' ? 1 : -1;
    const n = context.neighborContext || {
      nearestDistNorm: 1,
      nearestDxNorm: 0,
      nearestDyNorm: 0,
      nearestRelSpeed: 0,
      leadRisk: 0,
      leadClosing: 0,
      leadTtcRisk: 0,
      rearRisk: 0,
      rearClosing: 0,
      conflictRisk: 0,
      conflictClosing: 0,
      conflictTtcRisk: 0,
      nearbyCountNorm: 0,
      minTtcRisk: 0,
      leadTtcNorm: 1,
      conflictTtcNorm: 1,
      minTtcNorm: 1,
      priorityAdvantage: 0
    };
    const signedDistToYieldLineNorm = Number.isFinite(context.signedDistToYieldLineNorm)
      ? clamp(context.signedDistToYieldLineNorm, -1.5, 1.5)
      : 1.5;
    const onMainRoad = context.onMainRoad ? 1 : 0;
    const isEllipseToVerticalLeft = context.isEllipseToVerticalLeft ? 1 : 0;
    const isEllipseToVerticalRight = context.isEllipseToVerticalRight ? 1 : 0;
    const isVerticalToEllipseRight = context.isVerticalToEllipseRight ? 1 : 0;
    const isVerticalToEllipseLeft = context.isVerticalToEllipseLeft ? 1 : 0;
    const isSameLaneAhead = context.isSameLaneAhead ? 1 : 0;
    const overlapSameLane = context.overlapType === 'same-lane' ? 1 : 0;
    const overlapCrossroadClockwise = context.overlapType === 'crossroad-clockwise' ? 1 : 0;
    const overlapCrossroadCounterclockwise = context.overlapType === 'crossroad-counterclockwise' ? 1 : 0;
    const overlapMerging = context.overlapType === 'merging' ? 1 : 0;
    const priorityStatus = Number.isFinite(context.priorityStatus) ? clamp(context.priorityStatus, -1, 1) : 0;
    const roadEdgeSensors = Array.isArray(context.roadEdgeSensors) ? context.roadEdgeSensors.slice(0, ROAD_EDGE_RAY_COUNT) : [];
    while (roadEdgeSensors.length < ROAD_EDGE_RAY_COUNT) roadEdgeSensors.push(1);
    const currentAccelerationNorm = Number.isFinite(context.currentAcceleration)
      ? clamp(context.currentAcceleration / 0.08, -1.5, 1.5)
      : 0;
    const headingLookahead50Norm = Number.isFinite(context.headingLookahead50Norm)
      ? clamp(context.headingLookahead50Norm, -1, 1)
      : 0;
    const headingLookahead100Norm = Number.isFinite(context.headingLookahead100Norm)
      ? clamp(context.headingLookahead100Norm, -1, 1)
      : 0;
    const vec = [
      speedNorm,
      laneErrNorm,
      currentAccelerationNorm,
      context.shouldStop ? 1 : 0,
      clamp(context.needsAggressive, 0, 1),
      car.isYielding ? 1 : 0,
      context.isAtStopPoint ? 1 : 0,
      car.isCommittedToTurn ? 1 : 0,
      pathCode,
      car.direction === 1 ? 1 : -1,
      turnCode,
      clamp(Math.sin(car.heading), -1, 1),
      clamp(Math.cos(car.heading), -1, 1),
      context.onGrass ? 1 : 0,
      ...roadEdgeSensors,
      headingLookahead50Norm,
      headingLookahead100Norm,
      n.nearestDistNorm,
      n.nearestDxNorm,
      n.nearestDyNorm,
      n.nearestRelSpeed,
      n.leadRisk,
      n.leadClosing,
      n.leadTtcNorm,
      n.rearRisk,
      n.rearClosing,
      signedDistToYieldLineNorm,
      onMainRoad,
      isEllipseToVerticalLeft,
      isEllipseToVerticalRight,
      isVerticalToEllipseRight,
      isVerticalToEllipseLeft,
      isSameLaneAhead,
      overlapSameLane,
      overlapCrossroadClockwise,
      overlapCrossroadCounterclockwise,
      overlapMerging,
      clamp(n.priorityAdvantage, -1, 1),
      priorityStatus,
      n.nearbyCountNorm,
      n.minTtcNorm
    ];
    if (vec.length !== INPUT_DIM) {
      logEvent('behavior', `state vector size mismatch: got=${vec.length} expected=${INPUT_DIM}`, true);
    }
    return vec;
  }

  // Default properties for a car
  const CAR_DEFAULTS = {
    maximumSpeed: 0.135,
    speed: 0.05,
    currentSpeedFactor: 1.0,
    x: 0, y: 0,
    rearX: 0, rearY: 0, frontX: 0, frontY: 0,
    heading: 0,
    steerAngle: 0,
    targetSteerAngle: 0,
    lastLoggedHeading: 0,
    lastLoggedX: 0, lastLoggedY: 0,
    path: "ellipse",
    verticalDirection: null,
    direction: 1,
    isMakingTurn: false,
    turnDirection: null,
    rejoinBuffer: 0,
    turnState: null,
    canDecide: true,
    isYielding: false,
    yieldStartTime: 0,
    isCommittedToTurn: false,
    loggedCommit: false,
    lastRuleViolation: false,
    pendingCrashPenalty: 0,
    lastReward: 0,
    lastAccelDelta: 0,
    prevSpeedFactor: 1.0,
    lastHeuristicLead: false,
    lastPolicyTransition: null,
    lastHeuristicSample: null,
    crashThisFrame: false,
    lastOnGrass: false,
    recentHeuristicSamples: null,
    debugDecision: null,
    debugHistory: null,
    stoppedSince: 0,
    cmdSpeedFactor: null,
    smoothedCollisionSlowdown: null,
    speedAccel: 0,
    smoothedCurveCap: 1,
    smoothedTurnCap: 1,
    turnExitRemainPx: 0,
    smoothedSteer: 0,
    forceUnstickFrames: 0,
    railId: 'ellipse-cw',
    s: 0,
    turnJunction: null
  };

  // Helper to create a car object with default and specific properties
  function createCar(overrides) {
    return { ...CAR_DEFAULTS, recentHeuristicSamples: [], ...overrides };
  }

function resetSimulation() {
    // Reset car1 (CW)
    Object.assign(car1, createCar({
        angle: 0, // Right side
        heading: Math.PI / 2, // Pointing up
        a: 560 - LANE_CENTER_OFFSET,
        b: 360 - LANE_CENTER_OFFSET,
        direction: 1
    }));

    // Reset car2 (CCW)
    Object.assign(car2, createCar({
        angle: Math.PI * 5 / 4,
        heading: Math.PI * 5 / 4 - Math.PI / 2, // Calculated based on angle for ellipse
        a: 560 + LANE_CENTER_OFFSET,
        b: 360 + LANE_CENTER_OFFSET,
        direction: -1
    }));

    // Reset car3 (CCW)
    Object.assign(car3, createCar({
        angle: Math.PI,
        heading: Math.PI - Math.PI / 2, // Calculated based on angle for ellipse
        a: 560 + LANE_CENTER_OFFSET,
        b: 360 + LANE_CENTER_OFFSET,
        direction: -1
    }));

    // Reset car4 (CW)
    Object.assign(car4, createCar({
        angle: Math.PI / 3,
        heading: Math.PI / 1.3, // Example fixed heading, consider dynamic calculation
        a: 560 - LANE_CENTER_OFFSET,
        b: 360 - LANE_CENTER_OFFSET,
        direction: 1
    }));

    // Reset car5 (CCW)
    Object.assign(car5, createCar({
        angle: -Math.PI / 2, // Top
        heading: Math.PI, // Pointing right
        a: 560 + LANE_CENTER_OFFSET,
        b: 360 + LANE_CENTER_OFFSET,
        direction: -1
    }));

    // Reset car6 (CW)
    Object.assign(car6, createCar({
        angle: Math.PI / 2, // Bottom
        heading: Math.PI, // Pointing left
        a: 560 - LANE_CENTER_OFFSET,
        b: 360 - LANE_CENTER_OFFSET,
        direction: 1
    }));

    // Initialize position and other calculated properties for all cars
    const allCars = [car1, car2, car3, car4, car5, car6];
    allCars.forEach(car => {
        car.x = centerX + car.a * Math.cos(car.angle);
        car.y = centerY + car.b * Math.sin(car.angle);
        car.rearX = car.x - Math.cos(car.heading) * WHEELBASE * 0.5;
        car.rearY = car.y - Math.sin(car.heading) * WHEELBASE * 0.5;
        car.frontX = car.rearX + Math.cos(car.heading) * WHEELBASE;
        car.frontY = car.rearY + Math.sin(car.heading) * WHEELBASE;
        car.lastLoggedHeading = car.heading;
        car.lastLoggedX = car.x;
        car.lastLoggedY = car.y;
        car.lastRuleViolation = false;
        car.pendingCrashPenalty = 0;
        car.lastReward = 0;
        car.lastAccelDelta = 0;
        car.prevSpeedFactor = car.currentSpeedFactor;
        car.lastPolicyTransition = null;
        car.crashThisFrame = false;
        car.lastOnGrass = false;
        car.debugDecision = null;
        car.debugHistory = [];
        car.stoppedSince = 0;
        car.cmdSpeedFactor = null;
        car.smoothedCollisionSlowdown = null;
        car.forceUnstickFrames = 0;
        car.turnJunction = null;
        attachCarToRail(car);
        car.prevPoseX = car.x;
        car.prevPoseY = car.y;
        car.prevPoseHeading = car.heading;
    });
    trainingBuffer = [];
    criticalTrainingBuffer = [];

    simFrame = 0;
    logWindowStartMs = performance.now();
    lastPretrainLogMs = 0;
    lastRLLogMs = 0;
    lastBehaviorLogMs = 0;
    lastCrashReport = null;
    lastCrashPauseReason = null;
    crashPauseArmed = true;
    frameCrashDetails = [];
    rlBaselineEMA = 0;
    rlRewardAbsDevEMA = 1;
    rlAdvantageEMA = 0;
    rlAdaptiveSigma = RL_SIGMA;
    rlBestScore = -Infinity;
    rlBestNetworkSnapshot = cloneNetwork(nn);
    rlReplayUpdateScale = 1;
    rlRecoveryStepsRemaining = 0;
    activeTrajectoryLength = BASE_TRAJECTORY_LENGTH;
    rlCrashEMA = 0;
    rlGrassEMA = 0;
    resetLogAccumulator();
    logEvent('lifecycle', 'simulation reset');

    if (!isSimulationRunning) {
      isSimulationRunning = true;
      const button = document.getElementById('toggleSimulationButton');
      if (button) button.textContent = 'Stop Simulation';
    }

    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
    }
    refreshStatusPanel();
    gameLoop();
  }
  let animationFrameId = null;
  let isSimulationRunning = true;

  // --- Three.js rendering -------------------------------------------------
  // One world unit is one original canvas pixel.  This lets the simulation,
  // collision geometry and controller remain entirely unchanged.
  let threeRenderer, threeScene, threeCamera, carTemplate;
  const threeCars = new Map();
  const trajectoryMeshes = new Map();
  const TRAJECTORY_VISUAL_SAMPLES = 40;
  const SIMULATION_VIEW_HEIGHT = 900;
  // Match CitySim: ~45° elevation (equal height and ground offset).
  const CAMERA_ELEVATION_RADIANS = THREE.MathUtils.degToRad(45);
  let lampGlowTexture = null;
  // The GLB is 4.1055 units long; match it to the existing collision/render length.
  const CAR_MODEL_SCALE = CAR_LENGTH / 4.1055;
  // Inferred from the GLB's named front/rear indicators once it is loaded.
  let modelForwardYaw = -Math.PI / 2;

  // --- Scene Setup (left panel) state ---
  const sceneSetup = {
    night: true,
    showTrajectories: true,
    brightness: { lampposts: 1, headlights: 1, blinkers: 1, brake: 1 }
  };
  const DAY_SCENE = {
    background: 0x4f943d,
    grass: 0x438c35,
    hemiSky: 0xd7ecff, hemiGround: 0x345d2c, hemiIntensity: 1.4,
    sunColor: 0xfff4dc, sunIntensity: 1.6
  };
  const NIGHT_SCENE = {
    background: 0x0b1026,
    grass: 0x16321b,
    hemiSky: 0x2e3f66, hemiGround: 0x0a1420, hemiIntensity: 0.45,
    sunColor: 0xa8c0ff, sunIntensity: 0.28
  };
  let trackLamps = null; // { materials, glows, lights } collected by switchOnTrackLamps
  let grassMesh = null;
  let hemiLight = null;
  let sunLight = null;

  function worldX(x) { return x - centerX; }
  function worldZ(y) { return y - centerY; }

  function getRenderPose(car) {
    const hasPrev = Number.isFinite(car.prevPoseX) && Number.isFinite(car.prevPoseY) &&
                    Number.isFinite(car.prevPoseHeading);
    if (!hasPrev || !Number.isFinite(car.x) || !Number.isFinite(car.y)) {
      return { x: car.x, y: car.y, heading: car.heading };
    }
    const dh = normalizeAngle(car.heading - car.prevPoseHeading);
    return {
      x: car.prevPoseX + (car.x - car.prevPoseX) * renderAlpha,
      y: car.prevPoseY + (car.y - car.prevPoseY) * renderAlpha,
      heading: car.prevPoseHeading + dh * renderAlpha
    };
  }

  const TRACK_WIDEN_FACTOR = 1.15;
  const TRACK_RING_A = 46;
  const TRACK_RING_B = 28;
  const TRACK_ISLAND_SCALE = (1 - 0.125 * TRACK_WIDEN_FACTOR) / 0.875;
  const TRACK_WIDEN_MESH_KINDS = {
    362: 'asphalt',
    8: 'stripMarking',
    64: 'stripMarking',
    112: 'ringMarking',
    168: 'ringMarking',
    640: 'ringMarking',
    2048: 'ringMarking',
    1968: 'ringMarking',
    1214: 'island',
    1728: 'curb'
  };

  function widenTrackPoint(kind, x, z) {
    if (kind === 'stripMarking') return [x * TRACK_WIDEN_FACTOR, z];
    if (kind === 'island') return [x * TRACK_ISLAND_SCALE, z * TRACK_ISLAND_SCALE];
    const d = Math.hypot(x / TRACK_RING_A, z / TRACK_RING_B);
    if (kind === 'curb') {
      const f = 1 + Math.max(d - 1, 0) * (TRACK_WIDEN_FACTOR - 1);
      return [x * f, z * f];
    }
    if (d >= 0.8 && d <= 1.2) {
      const f = (1 + (d - 1) * TRACK_WIDEN_FACTOR) / d;
      return [x * f, z * f];
    }
    if (kind === 'asphalt' && Math.abs(x) <= 5.5) return [x * TRACK_WIDEN_FACTOR, z];
    return [x, z];
  }

  function widenTrackGeometry(track) {
    const processed = new Set();
    track.traverse(node => {
      if (!node.isMesh || !node.geometry || !node.geometry.attributes.position) return;
      const kind = TRACK_WIDEN_MESH_KINDS[node.geometry.attributes.position.count];
      if (!kind) return;
      let attr = node.geometry.attributes.position;
      if (attr.isInterleavedBufferAttribute) {
        const flat = new Float32Array(attr.count * 3);
        for (let i = 0; i < attr.count; i++) {
          flat[i * 3] = attr.getX(i);
          flat[i * 3 + 1] = attr.getY(i);
          flat[i * 3 + 2] = attr.getZ(i);
        }
        attr = new THREE.BufferAttribute(flat, 3);
        node.geometry.setAttribute('position', attr);
      }
      if (processed.has(attr)) return;
      processed.add(attr);
      for (let i = 0; i < attr.count; i++) {
        const widened = widenTrackPoint(kind, attr.getX(i), attr.getZ(i));
        attr.setX(i, widened[0]);
        attr.setZ(i, widened[1]);
      }
      attr.needsUpdate = true;
      node.geometry.computeBoundingBox();
      node.geometry.computeBoundingSphere();
    });
  }

  function loadTrackModel() {
    new THREE.GLTFLoader().load('GeminiTrack.glb', gltf => {
      const track = gltf.scene;
      widenTrackGeometry(track);
      const scaleX = 560 / 46;
      const scaleZ = 360 / 28;
      const scaleY = (scaleX + scaleZ) / 2;
      track.scale.set(scaleX, scaleY, scaleZ);
      track.position.set(0, 0, 0);
      track.traverse(child => {
        if (child.isMesh) {
          child.frustumCulled = false;
          child.receiveShadow = true;
          if (child.name.includes('Tree') || child.name.includes('Trunk') || child.name.includes('Foliage') ||
              child.name.includes('Pole') || child.name.includes('Signal') || child.name.includes('Pedestrian') ||
              child.name.includes('Lamp')) {
            child.castShadow = true;
          }
        }
      });
      threeScene.add(track);
      switchOnTrackLamps(track);
    }, undefined, error => console.error('Unable to load GeminiTrack.glb', error));
  }

  function switchOnTrackLamps(track) {
    track.updateMatrixWorld(true);
    trackLamps = { materials: [], glows: [], lights: [] };
    // Bulb/housing primitives of the lamp heads (pole and base stay dark).
    const bulbMaterialNames = new Set(['Материал.022', 'Материал.023']);
    let litCount = 0;
    const posts = [];
    // GLTFLoader strips dots from node names ('Street_Lamp.001' -> 'Street_Lamp001').
    track.traverse(child => {
      if (/^Street_Lamp[.]?\d*$/.test(child.name)) posts.push(child);
    });
    for (const post of posts) {
      let firstBulb = null;
      post.traverse(child => {
        if (!child.isMesh) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        if (!mats.some(m => bulbMaterialNames.has(m.name))) return;
        child.material = Array.isArray(child.material)
          ? child.material.map(material => material.clone())
          : child.material.clone();
        const clonedMats = Array.isArray(child.material) ? child.material : [child.material];
        for (const material of clonedMats) {
          if (!material.emissive) continue;
          material.emissive.setHex(0xffd9a0);
          trackLamps.materials.push(material);
        }
        if (!firstBulb) firstBulb = child;
      });
      if (!firstBulb) continue;
      const glow = attachLampGlow(firstBulb, 0xffd9a0, 3.2).glow;
      trackLamps.glows.push(glow);
      const centerWorld = lampMeshBounds(firstBulb).getCenter(new THREE.Vector3());
      const light = new THREE.PointLight(0xffc987, 1.8, 320, 2);
      light.position.copy(track.worldToLocal(centerWorld.clone()));
      track.add(light);
      trackLamps.lights.push(light);
      litCount++;
    }
    logEvent('lifecycle', `${litCount} street lamps registered`);
    applyLampposts();
  }

  function applyLampposts() {
    if (!trackLamps) return;
    const on = sceneSetup.night;
    const b = Math.max(0, sceneSetup.brightness.lampposts);
    for (const material of trackLamps.materials) {
      material.emissiveIntensity = on ? 2.2 * b : 0;
    }
    for (const glow of trackLamps.glows) {
      glow.visible = on && b > 0;
      glow.material.opacity = Math.min(1, 0.85 * b);
    }
    for (const light of trackLamps.lights) {
      light.intensity = on ? 1.8 * b : 0;
    }
  }

  function applyDayNight() {
    if (!threeScene) return;
    const cfg = sceneSetup.night ? NIGHT_SCENE : DAY_SCENE;
    threeScene.background.setHex(cfg.background);
    if (grassMesh) grassMesh.material.color.setHex(cfg.grass);
    if (hemiLight) {
      hemiLight.color.setHex(cfg.hemiSky);
      hemiLight.groundColor.setHex(cfg.hemiGround);
      hemiLight.intensity = cfg.hemiIntensity;
    }
    if (sunLight) {
      sunLight.color.setHex(cfg.sunColor);
      sunLight.intensity = cfg.sunIntensity;
    }
    applyLampposts();
  }

  function getLampGlowTexture() {
    if (lampGlowTexture) return lampGlowTexture;
    const size = 128;
    const canvas2d = document.createElement('canvas');
    canvas2d.width = size;
    canvas2d.height = size;
    const ctx = canvas2d.getContext('2d');
    const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.22, 'rgba(255,255,255,0.7)');
    gradient.addColorStop(0.55, 'rgba(255,255,255,0.22)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    lampGlowTexture = new THREE.CanvasTexture(canvas2d);
    return lampGlowTexture;
  }

  let beamFadeTexture = null;
  function getBeamFadeTexture() {
    if (beamFadeTexture) return beamFadeTexture;
    const size = 128;
    const canvas2d = document.createElement('canvas');
    canvas2d.width = size;
    canvas2d.height = size;
    const ctx = canvas2d.getContext('2d');
    // Bright at the cone apex (texture v=1 / canvas top), fading to the far end.
    const fade = ctx.createLinearGradient(0, 0, 0, size);
    fade.addColorStop(0, 'rgba(255,255,255,0.85)');
    fade.addColorStop(0.3, 'rgba(255,255,255,0.38)');
    fade.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, size, size);
    beamFadeTexture = new THREE.CanvasTexture(canvas2d);
    return beamFadeTexture;
  }

  function lampMeshBounds(object) {
    const box = new THREE.Box3();
    let found = false;
    object.updateWorldMatrix(true, true);
    object.traverse(child => {
      if (!child.isMesh || !child.geometry) return;
      if (!child.geometry.boundingBox) child.geometry.computeBoundingBox();
      const childBox = child.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld);
      if (!found) {
        box.copy(childBox);
        found = true;
      } else {
        box.union(childBox);
      }
    });
    if (!found) box.setFromObject(object);
    return box;
  }

  function attachLampGlow(object, color, glowSpread) {
    const box = lampMeshBounds(object);
    const centerWorld = box.getCenter(new THREE.Vector3());
    const sizeWorld = box.getSize(new THREE.Vector3());
    const parentScale = object.getWorldScale(new THREE.Vector3());
    const centerLocal = object.worldToLocal(centerWorld.clone());
    const worldSpan = Math.max(sizeWorld.x, sizeWorld.y, sizeWorld.z, 6);
    const localScale = (worldSpan * glowSpread) / Math.max(0.001, (parentScale.x + parentScale.y) * 0.5);

    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: getLampGlowTexture(),
      color,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0
    }));
    glow.position.copy(centerLocal);
    glow.scale.set(localScale, localScale, 1);
    glow.renderOrder = 12;
    glow.visible = false;
    object.add(glow);
    return { glow };
  }

  const LIGHT_KIND_STYLE = {
    brake: { color: 0xff2211, glowSpread: 4.2 },
    blinker: { color: 0xffa000, glowSpread: 3.6 },
    head: { color: 0xe8f2ff, glowSpread: 1.3 }
  };

  function configureLightMesh(object, kind, withGlow = true) {
    const style = LIGHT_KIND_STYLE[kind] || LIGHT_KIND_STYLE.blinker;
    const materials = [];
    object.traverse(child => {
      if (!child.isMesh) return;
      child.material = Array.isArray(child.material)
        ? child.material.map(material => material.clone())
        : child.material.clone();
      const meshMaterials = Array.isArray(child.material) ? child.material : [child.material];
      materials.push(...meshMaterials);
    });
    const fx = withGlow ? attachLampGlow(object, style.color, style.glowSpread) : { glow: null };
    return { materials, glow: fx.glow };
  }

  function inferModelForwardYaw(root) {
    const frontLeft = root.getObjectByName('TurnSignal_FL');
    const frontRight = root.getObjectByName('TurnSignal_FR');
    const rearLeft = root.getObjectByName('TurnSignal_RL');
    const rearRight = root.getObjectByName('TurnSignal_RR');
    if (!frontLeft || !frontRight || !rearLeft || !rearRight) return modelForwardYaw;
    root.updateMatrixWorld(true);
    const front = new THREE.Vector3()
      .add(frontLeft.getWorldPosition(new THREE.Vector3()))
      .add(frontRight.getWorldPosition(new THREE.Vector3()))
      .multiplyScalar(0.5);
    const rear = new THREE.Vector3()
      .add(rearLeft.getWorldPosition(new THREE.Vector3()))
      .add(rearRight.getWorldPosition(new THREE.Vector3()))
      .multiplyScalar(0.5);
    return Math.atan2(front.z - rear.z, front.x - rear.x);
  }

  function buildCarVisual(car) {
    if (!carTemplate) return null;
    // Rotate a clean wrapper, not the GLB root: the GLB root already contains
    // import rotations and cannot be safely yawed by editing its Euler values.
    const visual = new THREE.Group();
    const model = carTemplate.clone(true);
    model.scale.setScalar(CAR_MODEL_SCALE);
    model.rotation.y = Math.PI / 2;   // counterclockwise 90°
    visual.add(model);
    model.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
    const lights = { brake: [], left: [], right: [], head: [] };
    const namedLights = {
      brake: ['BrakeLight_L', 'BrakeLight_R'],
      left: ['TurnSignal_FL', 'TurnSignal_RL'],
      right: ['TurnSignal_FR', 'TurnSignal_RR'],
      head: ['FrontLights']
    };
    for (const [kind, names] of Object.entries(namedLights)) {
      for (const name of names) {
        const object = visual.getObjectByName(name);
        if (object) lights[kind].push(configureLightMesh(object, kind, kind !== 'head'));
        else console.warn(`Car model light mesh not found: ${name}`);
      }
    }
    visual.userData.lights = lights;
    visual.userData.lastSpeedFactor = car.currentSpeedFactor;
    // Headlight beams + halos originate at the two lamp positions of the
    // FrontLights glass strip (the model faces -Z locally after the PI/2
    // import rotation, so the strip's wide axis is the car's lateral axis).
    visual.updateMatrixWorld(true);
    const beamSpots = [];
    const headHalos = [];
    const beamCones = [];
    const headObj = visual.getObjectByName('FrontLights');
    if (headObj) {
      const box = lampMeshBounds(headObj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const forwardLocal = new THREE.Vector3(0, 0, -1);
      for (const sign of [-1, 1]) {
        const srcLocal = center.clone();
        if (size.x >= size.z) srcLocal.x += sign * size.x * 0.25;
        else srcLocal.z += sign * size.z * 0.25;
        const spot = new THREE.SpotLight(0xfff3d6, 0, 240, 0.35, 0.5, 1.15);
        spot.visible = false;
        threeScene.add(spot);
        threeScene.add(spot.target);
        beamSpots.push({ spot, srcLocal });
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: getLampGlowTexture(),
          color: 0xe8f2ff,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0
        }));
        halo.position.copy(srcLocal).addScaledVector(forwardLocal, CAR_LENGTH * 0.04);
        halo.scale.setScalar(CAR_LENGTH * 0.38);
        halo.renderOrder = 12;
        halo.visible = false;
        visual.add(halo);
        headHalos.push(halo);
        // Volumetric-looking beam cone: apex at the lamp, opening forward and
        // slightly down, fading out along its length.
        const coneLen = CAR_LENGTH * 1.7;
        const coneGeo = new THREE.ConeGeometry(CAR_LENGTH * 0.55, coneLen, 24, 1, true);
        coneGeo.translate(0, -coneLen / 2, 0);
        const coneMat = new THREE.MeshBasicMaterial({
          map: getBeamFadeTexture(),
          color: 0xfff3d6,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        const cone = new THREE.Mesh(coneGeo, coneMat);
        cone.rotation.x = Math.PI * 0.42;
        cone.renderOrder = 11;
        const coneGroup = new THREE.Group();
        coneGroup.position.copy(srcLocal).addScaledVector(forwardLocal, CAR_LENGTH * 0.06);
        coneGroup.add(cone);
        coneGroup.visible = false;
        visual.add(coneGroup);
        beamCones.push({ group: coneGroup, material: coneMat });
      }
    }
    visual.userData.beamSpots = beamSpots;
    visual.userData.headHalos = headHalos;
    visual.userData.beamCones = beamCones;
    threeScene.add(visual);
    threeCars.set(car, visual);
    return visual;
  }

  function brightnessForKind(kind) {
    if (kind === 'head') return sceneSetup.brightness.headlights;
    if (kind === 'brake') return sceneSetup.brightness.brake;
    if (kind === 'left' || kind === 'right') return sceneSetup.brightness.blinkers;
    return 1;
  }

  function setLampState(lamps, active, color, kind) {
    const b = Math.max(0, brightnessForKind(kind));
    for (const lamp of lamps) {
      for (const material of lamp.materials) {
        if (!material.emissive) continue;
        material.emissive.setHex(active ? color : 0x000000);
        material.emissiveIntensity = active ? 6.5 * b : 0;
      }
      if (lamp.glow) {
        lamp.glow.visible = active && b > 0;
        lamp.glow.material.color.setHex(color);
        lamp.glow.material.opacity = active ? Math.min(1, 0.95 * b) : 0;
      }
    }
  }

  function turnTypeFor(car) {
    if ((car.turnState === 'turning' || car.turnState === 'approaching') && car.path === 'ellipse' &&
        (car.turnDirection === 'left' || car.turnDirection === 'right') && car.isMakingTurn) {
      return car.turnDirection === 'left' ? 'ellipse-to-vertical-left' : 'ellipse-to-vertical-right';
    }
    if (car.turnState === 'rejoining' || hasPlannedVerticalExit(car) ||
        (car.path === 'vertical' && (car.turnDirection === 'left' || car.turnDirection === 'right'))) {
      return car.turnDirection === 'left' ? 'vertical-to-ellipse-left' : 'vertical-to-ellipse-right';
    }
    return 'straight';
  }

  function trajectoryColor(turnType) {
    return {
      'ellipse-to-vertical-left': 0x2563eb,
      'ellipse-to-vertical-right': 0x06b6d4,
      'vertical-to-ellipse-left': 0xef4444,
      'vertical-to-ellipse-right': 0xeab308
    }[turnType] || 0x22c55e;
  }

  function updateTrajectoryVisual(car) {
    let meshes = trajectoryMeshes.get(car);
    if (!sceneSetup.showTrajectories) {
      if (meshes) meshes.forEach(mesh => { mesh.visible = false; });
      return;
    }
    if (!meshes) {
      meshes = Array.from({ length: TRAJECTORY_VISUAL_SAMPLES }, () => {
        const mesh = new THREE.Group();
        const fill = new THREE.Mesh(
          new THREE.PlaneGeometry(CAR_LENGTH, 230 * CAR_SCALE),
          new THREE.MeshBasicMaterial({
            transparent: true,
            opacity: 0.16,
            depthTest: true,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -8,
            polygonOffsetUnits: -8
          })
        );
        fill.rotation.x = -Math.PI / 2;
        fill.renderOrder = 3;
        mesh.add(fill);
        mesh.userData.material = fill.material;
        mesh.position.y = 0.18;
        mesh.renderOrder = 3;
        threeScene.add(mesh);
        return mesh;
      });
      trajectoryMeshes.set(car, meshes);
    }
    const states = car.cachedTrajectory || predictTrajectory(car);
    const color = trajectoryColor(turnTypeFor(car));
    const pose = getRenderPose(car);
    const dx = (Number.isFinite(pose.x) && Number.isFinite(car.x)) ? pose.x - car.x : 0;
    const dy = (Number.isFinite(pose.y) && Number.isFinite(car.y)) ? pose.y - car.y : 0;
    meshes.forEach((mesh, index) => {
      const state = states[index];
      mesh.visible = !!state;
      if (!state) return;
      mesh.userData.material.color.setHex(color);
      mesh.position.set(worldX(state.x + dx), 0.18, worldZ(state.y + dy));
      mesh.rotation.y = -state.heading;
    });
  }

  function renderThreeScene() {
    if (!threeRenderer) return;
    const allCars = [car1, car2, car3, car4, car5, car6];
    const blinkOn = performance.now() % BLINKER_CYCLE_MS < BLINKER_ON_MS;
    for (const car of allCars) {
      const visual = threeCars.get(car) || buildCarVisual(car);
      if (!visual) continue;
      const pose = getRenderPose(car);
      visual.position.set(worldX(pose.x), 0.12, worldZ(pose.y));
      visual.rotation.y = modelForwardYaw - pose.heading + Math.PI / 2;
      visual.userData.renderHeading = pose.heading;
      const blinker = blinkerSide(car);
      setLampState(visual.userData.lights.left, blinker === 'left' && blinkOn, 0xffa000, 'left');
      setLampState(visual.userData.lights.right, blinker === 'right' && blinkOn, 0xffa000, 'right');
      const braking = car.currentSpeedFactor < visual.userData.lastSpeedFactor || car.isYielding;
      setLampState(visual.userData.lights.brake, braking, 0xff0808, 'brake');
      setLampState(visual.userData.lights.head, sceneSetup.night, 0xe8f2ff, 'head');
      const headBrightness = sceneSetup.night ? Math.max(0, sceneSetup.brightness.headlights) : 0;
      updateHeadlightBeam(visual, car, headBrightness);
      visual.userData.lastSpeedFactor = car.currentSpeedFactor;
      updateTrajectoryVisual(car);
    }
    threeRenderer.render(threeScene, threeCamera);
  }

  function updateHeadlightBeam(visual, car, brightness) {
    const beamSpots = visual.userData.beamSpots;
    const headHalos = visual.userData.headHalos;
    if (!beamSpots || !Number.isFinite(car.frontX) || !Number.isFinite(car.frontY)) return;
    const on = brightness > 0;
    visual.updateMatrixWorld(true);
    const beamHeading = Number.isFinite(visual.userData.renderHeading)
      ? visual.userData.renderHeading
      : car.heading;
    const dirX = Math.cos(beamHeading);
    const dirZ = Math.sin(beamHeading);
    const latX = dirZ;
    const latZ = -dirX;
    let sideSign = 1;
    for (const entry of beamSpots) {
      const spot = entry.spot;
      spot.visible = on;
      spot.intensity = 1.8 * brightness;
      if (!on) continue;
      const pos = visual.localToWorld(entry.srcLocal.clone());
      spot.position.copy(pos);
      spot.target.position.set(
        pos.x + dirX * 85 + latX * 8 * sideSign,
        0,
        pos.z + dirZ * 85 + latZ * 8 * sideSign
      );
      spot.target.updateMatrixWorld();
      sideSign = -sideSign;
    }
    for (const halo of headHalos) {
      halo.visible = on;
      halo.material.opacity = Math.min(1, 0.9 * brightness);
    }
    for (const beamCone of visual.userData.beamCones || []) {

  function frameTrackInView() {
    if (!threeCamera) return;
    const outerA = 560 + ROAD_WIDTH / 2;
    const outerB = 360 + ROAD_WIDTH / 2;
    const ringPoints = [];
    for (let i = 0; i < 64; i++) {
      const t = (i / 64) * Math.PI * 2;
      ringPoints.push(new THREE.Vector3(outerA * Math.cos(t), 0, outerB * Math.sin(t)));
    }
    const dir = new THREE.Vector3(
      0,
      Math.sin(CAMERA_ELEVATION_RADIANS),
      Math.cos(CAMERA_ELEVATION_RADIANS)
    ).normalize();
    // Fit width only: zoom until the ring's leftmost/rightmost screen edges
    // reach the canvas sides. Vertical grass margin is allowed.
    let lo = 200;
    let hi = 5000;
    const targetX = 0.995;
    for (let i = 0; i < 28; i++) {
      const dist = (lo + hi) * 0.5;
      threeCamera.position.copy(dir).multiplyScalar(dist);
      threeCamera.lookAt(0, 0, 0);
      threeCamera.updateMatrixWorld(true);
      threeCamera.updateProjectionMatrix();
      let maxAbsX = 0;
      for (const point of ringPoints) {
        const ndc = point.clone().project(threeCamera);
        maxAbsX = Math.max(maxAbsX, Math.abs(ndc.x));
      }
      if (maxAbsX > targetX) lo = dist;
      else hi = dist;
    }
    threeCamera.position.copy(dir).multiplyScalar(hi);
    threeCamera.lookAt(0, 0, 0);
    threeCamera.updateProjectionMatrix();
  }

// --- NEW TRAJECTORY AND COLLISION HELPERS ---

// Helper function to get the four corners of a car's bounding box
function getCarBoundingBox(car) {
    const w = CAR_LENGTH / 2;
    const h = CAR_COLLISION_WIDTH / 2;
    const cosH = Math.cos(car.heading);
    const sinH = Math.sin(car.heading);

    const corners = [
        { x: -w, y: -h }, { x:  w, y: -h },
        { x:  w, y:  h }, { x: -w, y:  h }
    ];

    return corners.map(p => ({
        x: car.x + p.x * cosH - p.y * sinH,
        y: car.y + p.x * sinH + p.y * cosH
    }));
}

// ** NEW HELPER FUNCTION FOR SAT **
// Projects a polygon's vertices onto an axis to find the min/max projection
function projectPolygon(axis, polygon) {
    let min = Infinity;
    let max = -Infinity;
    for (const p of polygon) {
        const projection = p.x * axis.x + p.y * axis.y; // Dot product
        if (projection < min) {
            min = projection;
        }
        if (projection > max) {
            max = projection;
        }
    }
    return { min, max };
}

// ** NEW ROBUST COLLISION CHECK USING SEPARATING AXIS THEOREM (SAT) **
function checkPolygonIntersection(polyA, polyB) {
    const polygons = [polyA, polyB];
    let axes = [];

    // Get all the axes to test
    for (let i = 0; i < polygons.length; i++) {
        const poly = polygons[i];
        for (let j = 0; j < poly.length; j++) {
            const p1 = poly[j];
            const p2 = poly[(j + 1) % poly.length]; // Next vertex
            const edge = { x: p2.x - p1.x, y: p2.y - p1.y };
            // Get the perpendicular axis (normal)
            const axis = { x: -edge.y, y: edge.x };
            // Normalize the axis
            const length = Math.sqrt(axis.x * axis.x + axis.y * axis.y);
            axis.x /= length;
            axis.y /= length;
            axes.push(axis);
        }
    }

    // Test each axis
    for (const axis of axes) {
        const projectionA = projectPolygon(axis, polyA);
        const projectionB = projectPolygon(axis, polyB);

        // If the projections do not overlap, there is no collision
        if (projectionA.max < projectionB.min || projectionB.max < projectionA.min) {
            return false; // Found a separating axis
        }
    }

    // If no separating axis was found, the polygons are intersecting
    return true;
}
function checkTrajectoryVsStaticBox(trajectory, staticCarBox) {
    if (!trajectory || trajectory.length === 0) return false;
    for (const state of trajectory) {
        const predictedStateCar = { x: state.x, y: state.y, heading: state.heading };
        const predictedBox = getCarBoundingBox(predictedStateCar);

        // Use the new, robust intersection check
        if (checkPolygonIntersection(predictedBox, staticCarBox)) {
            return true; // Collision detected
        }
    }
    return false; // No collision found
}

function occupancyAheadOfCar(car, box) {
    let cx = 0;
    let cy = 0;
    for (const p of box) {
      cx += p.x;
      cy += p.y;
    }
    cx /= box.length;
    cy /= box.length;
    const ahead = Math.cos(car.heading) * (cx - car.x) + Math.sin(car.heading) * (cy - car.y);
    return ahead > CAR_LENGTH * 0.15;
}

function checkTrajectoryIntersection(car, otherCar) {
    const myTrajectory = predictTrajectory(car);
    const otherTrajectory = predictTrajectory(otherCar);
    const otherBox = getCarBoundingBox(otherCar);

    // A car behind us will always “hit” our current body along its future path.
    // That is following, not a crossroad conflict — ignore it here.
    const otherAhead =
      Math.cos(car.heading) * (otherCar.x - car.x) + Math.sin(car.heading) * (otherCar.y - car.y);

    if (myTrajectory.length > 0 && otherTrajectory.length > 0 && otherAhead > -CAR_LENGTH * 0.35) {
        const sampleTrajectory = trajectory => {
            const stride = Math.max(1, Math.ceil(trajectory.length / TRAJECTORY_OCCUPANCY_SAMPLES));
            const samples = [];
            for (let i = 0; i < trajectory.length; i += stride) samples.push(trajectory[i]);
            const finalState = trajectory[trajectory.length - 1];
            if (samples[samples.length - 1] !== finalState) samples.push(finalState);
            return samples;
        };
        const otherFutureBoxes = sampleTrajectory(otherTrajectory)
            .map(state => getCarBoundingBox({ x: state.x, y: state.y, heading: state.heading }))
            .filter(box => occupancyAheadOfCar(car, box));
        for (const myFutureState of sampleTrajectory(myTrajectory)) {
            const myFutureBox = getCarBoundingBox({
                x: myFutureState.x,
                y: myFutureState.y,
                heading: myFutureState.heading
            });
            if (!occupancyAheadOfCar(car, myFutureBox)) continue;
            for (const otherFutureBox of otherFutureBoxes) {
                if (checkPolygonIntersection(myFutureBox, otherFutureBox)) {
                    return true;
                }
            }
        }
    }

    return checkTrajectoryVsStaticBox(myTrajectory, otherBox);
}

/**
 * Distance along `car`'s planned path until its sprite would hit `otherCar`'s
 * *current* body (static occupancy). Future-vs-future is intentionally NOT used
 * here — that caused permanent crossroad gridlocks where both cars braked for
 * each other's predicted paths. Yield rules handle interactive right-of-way.
 */
function getStaticOccupancyHitDistance(car, otherCar) {
    if (checkPolygonIntersection(getCarBoundingBox(car), getCarBoundingBox(otherCar))) {
      return 0;
    }
    const myTrajectory = predictTrajectory(car);
    if (!myTrajectory.length) return Infinity;

    let traveled = 0;
    let prevX = car.x;
    let prevY = car.y;
    const otherBox = getCarBoundingBox(otherCar);

    for (const state of myTrajectory) {
      traveled += Math.hypot(state.x - prevX, state.y - prevY);
      prevX = state.x;
      prevY = state.y;
      const myBox = getCarBoundingBox({ x: state.x, y: state.y, heading: state.heading });
      if (checkPolygonIntersection(myBox, otherBox)) {
        return traveled;
      }
    }
    return Infinity;
}

/** True if `car` has right-of-way over `other` for deadlock / defensive decisions. */
function hasMainRoadPriorityOver(car, other) {
    const carIsRejoining = car.turnState === 'rejoining' || (car.path === 'ellipse' && car.verticalDirection !== null);
    const otherIsRejoining = other.turnState === 'rejoining' || (other.path === 'ellipse' && other.verticalDirection !== null);
    const carOnMain = car.path === 'ellipse' && !carIsRejoining;
    const otherOnMain = other.path === 'ellipse' && !otherIsRejoining;
    // Free ellipse traffic outranks vertical / rejoin (Rules 2.1 vs 2.2).
    if (carOnMain && !otherOnMain) return true;
    if (!carOnMain && otherOnMain) return false;
    // Free through traffic on the ellipse outranks uncommitted ellipse→vertical exits
    // (Rule 2.2: the exiting car yields; the through car keeps ROW — Car6 vs Car1 bug).
    const carFreeThrough = carOnMain && !isEllipseToVerticalManeuver(car);
    const otherFreeThrough = otherOnMain && !isEllipseToVerticalManeuver(other);
    const carUncommittedExit = isEllipseToVerticalManeuver(car) && !car.isCommittedToTurn;
    const otherUncommittedExit = isEllipseToVerticalManeuver(other) && !other.isCommittedToTurn;
    if (carFreeThrough && otherUncommittedExit) return true;
    if (otherFreeThrough && carUncommittedExit) return false;
    // Car already committed into the junction outranks cars still waiting to enter.
    if (car.isCommittedToTurn && !other.isCommittedToTurn) return true;
    if (!car.isCommittedToTurn && other.isCommittedToTurn) return false;
    if (car.turnState === 'turning' && (other.turnState === 'approaching' || other.turnState === 'rejoining')) return true;
    if ((car.turnState === 'approaching' || car.turnState === 'rejoining') && other.turnState === 'turning') return false;

    if (!carIsRejoining && otherIsRejoining) return true;
    if (carIsRejoining && !otherIsRejoining) return false;

/**

function isHigherPriorityEllipseCrossTraffic(car, other) {
    if (!other) return false;

    const otherIsRejoining = other.turnState === 'rejoining' ||
      (other.path === 'ellipse' && other.verticalDirection !== null);
    const otherFreeThrough =
      other.path === 'ellipse' &&
      !otherIsRejoining &&
      !isEllipseToVerticalManeuver(other);
    if (otherFreeThrough) return true;
    // Rule 2.2.1: left exit yields to opposite direction on the elliptical road
    // (free through, right-turn waiters, and cars already mid-turn / rejoining).
    const opposite =
      (car.direction === 1 && other.direction === -1) ||
      (car.direction === -1 && other.direction === 1);
    if (!opposite) return false;
    if (other.path === 'ellipse') return true;
    if (other.path === 'vertical' && other.turnState === 'turning') return true;
    if (otherIsRejoining) return true;
    return false;

function isEllipseExitingToVertical(c) {
    if (!c || !c.isMakingTurn) return false;
    if (c.turnDirection !== 'left' && c.turnDirection !== 'right') return false;
    // Still on ellipse, committed to a vertical exit.
    if (c.path === 'ellipse' && c.verticalDirection === null) return true;
    // Just transitioned ellipse → vertical (turnState 'turning'; vertical→ellipse uses approaching/rejoining).
    if (c.path === 'vertical' && c.turnState === 'turning') return true;

/** Vertical car planning / performing exit onto the ellipse. */
function isVerticalExitingToEllipse(c) {
    if (!c) return false;
    if (c.turnDirection !== 'left' && c.turnDirection !== 'right') return false;
    // turnState === 'turning' means ellipse→vertical mid-entry (see hasPlannedVerticalExit).
    // Must NOT classify those as vertical→ellipse, or two ellipse exits (left+right)
    // get treated as a "complementary" pair and force-unstick plows one into the other.
    if (c.turnState === 'turning') return false;
    if (c.path === 'vertical' && (c.turnState === 'approaching' || c.turnState === 'rejoining')) return true;
    if (c.turnState === 'rejoining') return true;
    // Vertical car that has chosen a turn but is still on the side road (not yet approaching flag).
    if (c.path === 'vertical' && c.isMakingTurn && c.verticalDirection !== null) return true;

/**
 * Complementary crossroad pair that usually does not share a conflict zone:
 * vertical→ellipse right vs ellipse→vertical left (and the mirror left/right pair).
 * Used to avoid false yields when trajectories only graze in the junction box.

function isComplementaryCrossroadPair(car, other) {
    // Two cars both entering the vertical from the ellipse share the junction —
    // never treat that as a non-conflicting complementary pair.
    if (isEllipseExitingToVertical(car) && isEllipseExitingToVertical(other)) return false;
    const carVertRight = isVerticalExitingToEllipse(car) && car.turnDirection === 'right';
    const carVertLeft = isVerticalExitingToEllipse(car) && car.turnDirection === 'left';
    const otherEllLeft = isEllipseExitingToVertical(other) && other.turnDirection === 'left';
    const otherEllRight = isEllipseExitingToVertical(other) && other.turnDirection === 'right';
    if (carVertRight && otherEllLeft) return true;
    if (carVertLeft && otherEllRight) return true;
    // Symmetric view (if the other car is evaluating yield the other way).
    const otherVertRight = isVerticalExitingToEllipse(other) && other.turnDirection === 'right';
    const otherVertLeft = isVerticalExitingToEllipse(other) && other.turnDirection === 'left';
    const carEllLeft = isEllipseExitingToVertical(car) && car.turnDirection === 'left';
    const carEllRight = isEllipseExitingToVertical(car) && car.turnDirection === 'right';
    if (otherVertRight && carEllLeft) return true;
    if (otherVertLeft && carEllRight) return true;

function isCarInCrossroadArea(c) {

      c.x > bottomCrossroadArea.x && c.x < bottomCrossroadArea.x + bottomCrossroadArea.width &&

    if (junction === 'top') return topCrossroadArea;
    if (junction === 'bottom') return bottomCrossroadArea;

    const midEllToVert = isEllipseToVerticalManeuver(c);

    if (midEllToVert && !c.isCommittedToTurn) s += 55;
    if (c.path === 'ellipse' && c.isMakingTurn && !midEllToVert) s += 70;
    if (c.isCommittedToTurn) s += 35;
    if (c.path === 'vertical' && c.turnState === 'turning') s += 30;
    if (rejoining) s += 15;
    if (c.path === 'vertical') s += 10;
    // Never prefer a car that force-unstick will immediately abort (stop-line waiter).
    if (!c.isCommittedToTurn && hasPlannedVerticalExit(c)) s -= 80;

        continue;

      c.forceUnstickFrames = GRIDLOCK_FORCE_FRAMES;
      forced++;

        'behavior',

/**
 * When cars are frozen, pick highest-priority ones and let them creep.

function resolveGridlock(allCars) {
    const now = performance.now();
    for (const c of allCars) {

    if (already >= 2) return;

    let forced = already;

    // 1) Global multi-car freeze
    const stuckGlobal = collectStuckCars(allCars, now);
    if (stuckGlobal.length >= GRIDLOCK_MIN_CARS) {
      forced = tryForceUnstick(stuckGlobal, forced, 'global');
    }

    // 2) Local freeze inside each crossroad box (even if only 2 cars)
    if (forced < 2) {
      for (const area of [topCrossroadArea, bottomCrossroadArea]) {
        const local = allCars.filter(c => {
          const inBox =
            c.x > area.x && c.x < area.x + area.width &&
            c.y > area.y && c.y < area.y + area.height;
          // Also include cars just outside the box but clearly at the junction exchange.
          const nearBox = Math.hypot(
            c.x - (area.x + area.width * 0.5),
            c.y - (area.y + area.height * 0.5)
          ) < ROAD_WIDTH * 2.2;
          return (inBox || nearBox) &&
            c.currentSpeedFactor < 0.08 &&
            c.stoppedSince &&
            (now - c.stoppedSince) >= GRIDLOCK_STUCK_MS * 0.7;
        });
        if (local.length >= 2) {
          forced = tryForceUnstick(local, forced, 'junction');
        }
        if (forced >= 2) break;
      }
    }

    // 3) Any complementary pair both nearly stopped → force the higher-priority one
    if (forced < 2) {
      for (let i = 0; i < allCars.length; i++) {
        for (let j = i + 1; j < allCars.length; j++) {
          const a = allCars[i];
          const b = allCars[j];
          if (a.currentSpeedFactor > 0.08 || b.currentSpeedFactor > 0.08) continue;
          if (!isComplementaryCrossroadPair(a, b)) continue;
          const aStuck = a.stoppedSince && (now - a.stoppedSince) > 900;
          const bStuck = b.stoppedSince && (now - b.stoppedSince) > 900;
          if (!aStuck && !bStuck) continue;
          // Prefer the actor that can actually leave (main-road / committed). Never pick
          // an uncommitted side-road waiter: control immediately aborts that unstick
          // (protectedYield) and the pair logs/re-freezes every frame.
          const aProtected = (!a.isCommittedToTurn && hasPlannedVerticalExit(a)) ||
            (a.turnState === 'rejoining' && a.currentSpeedFactor < 0.05);
          const bProtected = (!b.isCommittedToTurn && hasPlannedVerticalExit(b)) ||
            (b.turnState === 'rejoining' && b.currentSpeedFactor < 0.05);
          let pick = gridlockPriorityScore(a) >= gridlockPriorityScore(b) ? a : b;
          if (pick === a && aProtected && !bProtected) pick = b;
          else if (pick === b && bProtected && !aProtected) pick = a;
          else if (aProtected && bProtected) continue;
          const other = pick === a ? b : a;
          if (pick.forceUnstickFrames > 0) continue;
          if (!pick.isCommittedToTurn && hasPlannedVerticalExit(pick)) continue;
          if (checkPolygonIntersection(getCarBoundingBox(a), getCarBoundingBox(b))) continue;
          // Do not force creep if the picker's path already hits the other car closely.
          const hitPick = getStaticOccupancyHitDistance(pick, other);
          if (Number.isFinite(hitPick) && hitPick <= CAR_LENGTH * 0.9) continue;
          pick.forceUnstickFrames = GRIDLOCK_FORCE_FRAMES;
          forced++;
          logEvent('behavior', `gridlock unstick ${getCarName(pick)} (complementary pair)`, true);
          if (forced >= 2) return;
        }
      }
    }
}

// Helper function to check if a trajectory intersects with a rectangular area
function checkTrajectoryVsArea(trajectory, area) {
    for (const point of trajectory) {
        if (point.x > area.x && point.x < area.x + area.width &&
            point.y > area.y && point.y < area.y + area.height) {
            return true;
        }
    }
    return false;
}

// Ellipse lookahead used by live driving and trajectory prediction.
// During vertical→ellipse rejoin, use a moderate distance-based angular look-ahead
// so the merge target stays ahead of the car (~90° turn), not behind it (U-turn).
function getEllipseLookaheadPoint(car) {
    const isRejoining = car.path === 'ellipse' && car.verticalDirection !== null;
    const meanRadius = Math.max(1, (car.a + car.b) * 0.5);
    const angleOffset = isRejoining
      ? car.direction * (LOOK_AHEAD_DISTANCE / meanRadius)
      : car.direction * car.speed * 5;
    const look = car.angle + angleOffset;
    return {
      targetX: centerX + car.a * Math.cos(look),
      targetY: centerY + car.b * Math.sin(look)
    };
  }

  function getVerticalLookaheadPoint(car, lookAheadDistance = LOOK_AHEAD_DISTANCE) {
    const laneCenter = car.verticalDirection === 'up' ? UPWARD_LANE_X : DOWNWARD_LANE_X;
    return {
      targetX: laneCenter,
      targetY: car.y + (car.verticalDirection === 'down' ? lookAheadDistance : -lookAheadDistance)
    };
  }

  /**
   * Lookahead on the same rails the car drives. Read-only (no path mutations).
   */
  function applyPathGuidance(car) {
    const lookAheadDistance = LOOK_AHEAD_DISTANCE;
    const plan = railPlanFromCar(car);
    const railId = car.railId || (car.direction === -1 ? 'ellipse-ccw' : 'ellipse-cw');
    const s = Number.isFinite(car.s) ? car.s : 0;
    const p = sampleNetworkForward(railId, s, lookAheadDistance, plan);
    return { targetX: p.x, targetY: p.y };
  }

  /** Pure lookahead for sensors / NN features (does not mutate car). */
  function getLookaheadPointForPrediction(car, lookAheadDistance = LOOK_AHEAD_DISTANCE) {
    const plan = railPlanFromCar(car);
    const railId = car.railId || (car.direction === -1 ? 'ellipse-ccw' : 'ellipse-cw');
    const s = Number.isFinite(car.s) ? car.s : 0;
    const p = sampleNetworkForward(railId, s, lookAheadDistance, plan);
    return { targetX: p.x, targetY: p.y };
  }

  function computeTargetSteerAngle(car, targetX, targetY) {
    const dx = targetX - car.x;
    const dy = targetY - car.y;
    let targetHeading = (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) ? car.heading : Math.atan2(dy, dx);
    let headingError = targetHeading - car.heading;
    while (headingError > Math.PI) headingError -= 2 * Math.PI;
    while (headingError < -Math.PI) headingError += 2 * Math.PI;
    if (isNaN(headingError)) headingError = 0;

    const isOnVerticalSegment = car.path === 'vertical';
    const isRejoining = car.path === 'ellipse' && car.verticalDirection !== null;
    const boost = (isOnVerticalSegment || isRejoining) ? 1.2 : 1.0;
    return Math.max(
      -SYMMETRIC_MAX_TURN_STEER_ANGLE,
      Math.min(SYMMETRIC_MAX_TURN_STEER_ANGLE, headingError * STEERING_GAIN * boost)
    );

  // Predict future occupancy by walking the same rails the car will drive.
  function predictTrajectory(car) {
    const trajectory = [];
    const totalDistance = getTrajectoryDistancePx();
    const stepLength = Math.max(4, totalDistance / 40);
    const steps = Math.max(1, Math.ceil(totalDistance / stepLength));

    const ghost = {
      x: car.x,
      y: car.y,
      rearX: car.rearX,
      rearY: car.rearY,
      frontX: car.frontX,
      frontY: car.frontY,
      heading: car.heading,
      path: car.path,
      verticalDirection: car.verticalDirection,
      direction: car.direction,
      a: car.a,
      b: car.b,
      angle: car.angle,
      isMakingTurn: !!car.isMakingTurn,
      turnDirection: car.turnDirection,
      turnState: car.turnState,
      isCommittedToTurn: !!car.isCommittedToTurn,
      turnJunction: car.turnJunction,
      railId: car.railId,
      s: car.s,
      rejoinBuffer: car.rejoinBuffer,
      isYielding: false,
      steerAngle: car.steerAngle
    };
    if (!ghost.railId) {
      ghost.railId = ghost.direction === -1 ? 'ellipse-ccw' : 'ellipse-cw';
      ghost.s = 0;
    }

    for (let i = 0; i < steps; i++) {
      const dest = walkRails(ghost.railId, ghost.s, stepLength, railPlanFromCar(ghost), (nextId) => {
        enterRail(ghost, nextId);
      });
      ghost.railId = dest.railId;
      ghost.s = dest.s;
      if (ghost.turnState === 'rejoining') ghost.rejoinBuffer += stepLength;
      if (ghost.turnState === 'rejoining' && ghost.rejoinBuffer > REJOIN_BUFFER_DISTANCE) {
        ghost.verticalDirection = null;
        ghost.rejoinBuffer = 0;
        ghost.turnState = null;
        ghost.isMakingTurn = false;
        ghost.turnDirection = null;
        ghost.isCommittedToTurn = false;
        ghost.turnJunction = null;
      }
      poseFromRails(ghost);
      trajectory.push({ x: ghost.x, y: ghost.y, heading: ghost.heading });
    }
    return trajectory;
  }

    const dist = Math.max(0, speed);
    const dest = walkRails(car.railId, car.s, dist, railPlanFromCar(car), (nextId) => {
      enterRail(car, nextId);
    });
    car.railId = dest.railId;
    car.s = dest.s;
    if (car.turnState === 'rejoining' || (car.path === 'ellipse' && car.verticalDirection !== null)) {
      car.rejoinBuffer += dist;

    if (car.turnState === 'rejoining' && car.rejoinBuffer > REJOIN_BUFFER_DISTANCE) {

    }

function updateCar(car) {
